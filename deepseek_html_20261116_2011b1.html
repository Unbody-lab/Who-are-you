<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты — Пролог (Пиксель)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070a;
    color: #c8ccd4;
    font-family: 'VT323', monospace;
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }

  /* ===== КАТСЦЕНА ===== */
  #cutscene {
    position: fixed; inset: 0; z-index: 300;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s;
  }
  #cutscene.hidden { opacity: 0; pointer-events: none; }
  #csBg { position: absolute; inset: 0; transition: background 1.2s; background: #0a0a0a; }
  #csText {
    position: absolute; bottom: 0; left: 0; right: 0;
    min-height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.92) 35%);
    padding: 50px 80px; font-size: 32px; line-height: 1.4;
    color: #d8dce4; display: flex; align-items: flex-end; z-index: 2;
  }
  #csText span { max-width: 900px; }
  #csNext {
    position: absolute; bottom: 30px; right: 60px;
    color: #6b7f9e; font-size: 24px; font-style: italic;
    cursor: pointer; z-index: 3; animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* ===== ИГРА ===== */
  #game { position: fixed; inset: 0; opacity: 1; transition: opacity 1.5s; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
  #game.hidden { opacity: 0; pointer-events: none; }

  /* Холст, растянутый на весь экран с чёткими пикселями */
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a1218;
  }

  /* UI поверх холста */
  #uiOverlay {
    position: absolute; inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
  }

  #textPanel {
    pointer-events: auto;
    min-height: 100px;
    background: rgba(5,7,10,0.85);
    border: 2px solid #2a3548;
    padding: 20px 30px; font-size: 28px; line-height: 1.3;
    color: #b8bec8; margin-top: auto;
    max-width: 1000px;
    align-self: center;
    width: 100%;
  }
  #textPanel .speaker { color: #5a7a6a; font-style: italic; }

  #inventory { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  .item-icon {
    width: 48px; height: 48px;
    background: #1a2333; border: 2px solid #2a3548;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; transition: all 0.2s;
  }
  .item-icon:hover { border-color: #5a7a6a; box-shadow: 0 0 12px rgba(90,122,106,0.5); }

  #locTitle {
    position: absolute; top: 20px; left: 20px;
    font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
    color: #4a5568; font-family: 'VT323', monospace;
  }
  #controls {
    position: absolute; top: 50px; left: 20px;
    font-size: 18px; color: #3a4558; line-height: 1.5;
  }
  #controls b { color: #5a7a6a; }

  /* Модалка */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 40px;
  }
  #modal.open { display: flex; }
  #modalContent {
    background: #12181f; border: 2px solid #2a3548; padding: 40px;
    max-width: 600px; font-size: 26px; line-height: 1.4; color: #d0d4da;
    position: relative;
  }
  #modalClose { position: absolute; top: 12px; right: 16px; cursor: pointer; color: #6b7f9e; font-size: 32px; }
  #modalClose:hover { color: #b8bec8; }
</style>
</head>
<body>

<div id="cutscene">
  <div id="csBg"></div>
  <div id="csText"><span id="csTextContent"></span></div>
  <div id="csNext">нажми, чтобы продолжить →</div>
</div>

<div id="game" class="hidden">
  <canvas id="gameCanvas"></canvas>
  
  <div id="uiOverlay">
    <div>
      <div id="locTitle">Пролог · Сумрачный лес — КПП</div>
      <div id="controls"><b>ПКМ</b> — идти · <b>ЛКМ по объекту</b> — подойти и осмотреть</div>
    </div>
    <div id="inventory"></div>
    <div id="textPanel"><span id="textContent"></span></div>
  </div>

  <div id="modal">
    <div id="modalContent">
      <div id="modalClose">×</div>
      <div id="modalText"></div>
    </div>
  </div>
</div>

<script>
/* ============ СОСТОЯНИЕ ============ */
const state = {
  seen: {}, items: [], flags: {}, cutsceneDone: false,
  hero: { x: 200 },
};
const SAVE_KEY = 'kto_ty_pixel_v1';
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch(e) {} }
}

/* ============ ЗВУК/ТЕКСТ ============ */
let typeTimer = null;
function say(text, speaker) {
  const el = document.getElementById('textContent');
  const prefix = speaker ? `<span class="speaker">${speaker}:</span> ` : '';
  el.innerHTML = ''; let i = 0;
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); return; }
    el.innerHTML = prefix + text.slice(0, i + 1); i++;
  }, 25);
}
function typeInto(el, text, speed = 40, cb) {
  clearInterval(typeTimer); el.innerHTML = ''; let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); if (cb) cb(); return; }
    el.innerHTML = text.slice(0, i + 1); i++;
  }, speed);
}

/* ============ КАТСЦЕНА ============ */
const cutscene = [
  { bg: 'radial-gradient(circle at 50% 40%, #1a1410 0%, #050302 70%)', text: 'Ты не помнишь своего имени. Никто здесь его не помнит. Имени больше нет — есть только «ты».' },
  { bg: 'radial-gradient(circle at 50% 30%, #2a1a10 0%, #0a0604 70%)', text: 'Ты жил. Как все: дышал, забывал, обещал. Кому-то — важное. Кому-то — пустое.' },
  { bg: 'radial-gradient(circle at 50% 50%, #3a0a0a 0%, #0a0202 70%)', text: 'А потом — тишина. Не тьма, не свет. Просто тишина, в которой ты перестал быть.' },
  { bg: 'radial-gradient(circle at 50% 60%, #2a0a0a 0%, #050202 70%)', text: 'И вот ты здесь. Внизу. Там, где начинается всё, что ты откладывал.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a1a10 0%, #020604 70%)', text: 'Ты помнишь только её. Не лицо, не имя. Только тепло. И что-то в груди говорит: иди.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a1a10 0%, #020604 70%)', text: 'Сумрачный лес. КПП. Начало.' },
];
let csIndex = 0;
const csBg = document.getElementById('csBg');
const csTextContent = document.getElementById('csTextContent');
const csNext = document.getElementById('csNext');

function showCutscene() {
  document.getElementById('cutscene').classList.remove('hidden');
  document.getElementById('game').classList.add('hidden');
  csIndex = 0; renderCsSlide();
}
function renderCsSlide() {
  const slide = cutscene[csIndex];
  csBg.style.background = slide.bg;
  csNext.style.display = 'none';
  typeInto(csTextContent, slide.text, 40, () => { csNext.style.display = 'block'; });
}
csNext.addEventListener('click', () => {
  if (csIndex < cutscene.length - 1) { csIndex++; renderCsSlide(); }
  else {
    document.getElementById('cutscene').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    state.cutsceneDone = true; save();
    initGame();
  }
});

/* ============ ИГРА / CANVAS ============ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const SCENE_WIDTH = 1600; // виртуальная ширина мира
const FLOOR_Y = 260;      // уровень земли (в пикселях сцены)

let heroX = 200;
let targetX = null;
let heroDirection = 1; // 1 = вправо, -1 = влево
let walkTimer = 0;
let isWalking = false;
let cameraX = 0;
let pendingClick = null;
let lastTime = performance.now();

function initGame() {
  load();
  heroX = state.hero?.x ?? 200;
  cameraX = heroX - canvas.width / 2;
  
  // Настройка разрешения Canvas под окно (масштабирование с чёткими пикселями)
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  renderInventory();
  say("Сумрачный лес. Деревья стоят так плотно, что не видно неба. Перед тобой — КПП и шлагбаум. За ним — дорога вниз.");
  requestAnimationFrame(tick);
}

function resizeCanvas() {
  // Внутреннее разрешение фиксировано для пиксель-арта (например, 480x270)
  canvas.width = 480;
  canvas.height = 270;
  // CSS растягивает его на весь экран через width:100vw
}

/* ============ СПРАЙТЫ (16x32 пикселей, нарисованы кодом) ============ */
// Спрайт героя (тёмный плащ, красные глаза)
const HERO_PIXELS = [
  "....####....",
  "...######...",
  "...##oo##...",
  "...##oo##...",
  "....####....",
  "...######...",
  "..########..",
  "..########..",
  "..##....##..",
  "..##....##..",
  "...##..##...",
  "...##..##...",
  "....####....",
];

// Спрайт Харона (белая борода, весло)
const CHARON_PIXELS = [
  "....####....",
  "...######...",
  "...##oo##...",
  "...##oo##...",
  "...######...",
  "..##wwww##..",
  "..##wwww##..",
  "..########..",
  "..##....##..",
  "..##....##..",
  "...##..##...",
  "...##..##...",
  "....####....",
];

function drawSprite(pixels, x, y, scale = 2, colors) {
  for (let row = 0; row < pixels.length; row++) {
    for (let col = 0; col < pixels[row].length; col++) {
      const char = pixels[row][col];
      if (char === '.') continue;
      ctx.fillStyle = colors[char] || '#fff';
      ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
    }
  }
}

// Рисуем героя с анимацией ходьбы
function drawHero(x, y, isWalking, direction, walkTimer) {
  ctx.save();
  ctx.translate(x + 8, y + 16);
  if (direction < 0) ctx.scale(-1, 1);
  
  // Наклон тела при ходьбе (South Park style)
  let tilt = 0;
  if (isWalking) {
    tilt = Math.sin(walkTimer) * 0.15; // наклон вперёд-назад
  }
  ctx.rotate(tilt);

  const heroColors = {
    '#': '#1a2230', // тёмный плащ
    'o': '#ff2222', // красные глаза
  };

  drawSprite(HERO_PIXELS, -8, -16, 2, heroColors);
  
  // Ноги (анимация)
  if (isWalking) {
    ctx.fillStyle = '#1a2230';
    const legOffset = Math.sin(walkTimer * 2) * 2;
    ctx.fillRect(-6, 10, 4, 6 + legOffset);
    ctx.fillRect(2, 10, 4, 6 - legOffset);
  }
  
  ctx.restore();
}

// Рисуем Харона
function drawCharon(x, y, isWalking, walkTimer) {
  const charonColors = {
    '#': '#0d0d0d', // чёрная мантия
    'o': '#5a7a6a', // глаза
    'w': '#e0e0e0', // белая борода
  };
  
  ctx.save();
  ctx.translate(x + 8, y + 16);
  
  let tilt = 0;
  if (isWalking) {
    tilt = Math.sin(walkTimer) * 0.1;
  }
  ctx.rotate(tilt);

  drawSprite(CHARON_PIXELS, -8, -16, 2, charonColors);
  
  // Весло
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(10, -20, 4, 50);
  
  ctx.restore();
}

/* ============ ОТРИСОВКА МИРА ============ */
function drawWorld() {
  // Очистка
  ctx.fillStyle = '#0a1218';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // 1. Небо / фон (градиент)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  skyGrad.addColorStop(0, '#05080a');
  skyGrad.addColorStop(1, '#0a1a12');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, SCENE_WIDTH, FLOOR_Y);

  // 2. Деревья (силуэты)
  ctx.fillStyle = '#14201a';
  for (let i = 0; i < 20; i++) {
    const tx = i * 100 + Math.sin(i) * 20;
    ctx.fillRect(tx, 80, 20, FLOOR_Y - 80); // стволы
    // крона
    ctx.beginPath();
    ctx.arc(tx + 10, 80, 40, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3. Земля
  ctx.fillStyle = '#0a0f0d';
  ctx.fillRect(0, FLOOR_Y, SCENE_WIDTH, 20);

  // 4. КПП (Будка)
  ctx.fillStyle = '#0f1a16';
  ctx.fillRect(500, FLOOR_Y - 120, 100, 120); // стены
  ctx.fillStyle = '#1f3028';
  ctx.fillRect(490, FLOOR_Y - 130, 120, 10); // крыша
  ctx.fillStyle = '#2a3c34';
  ctx.fillRect(520, FLOOR_Y - 100, 60, 40); // окошко

  // 5. Шлагбаум
  ctx.fillStyle = '#1a2620';
  ctx.fillRect(620, FLOOR_Y - 80, 10, 80); // база
  // Полосатый шлагбаум
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#4a2020' : '#c8c8c8';
    ctx.fillRect(630 + i * 20, FLOOR_Y - 70, 20, 8);
  }

  // 6. Ключ-карта
  if (!state.items.includes('keycard')) {
    ctx.fillStyle = '#2a4a3a';
    ctx.fillRect(800, FLOOR_Y - 4, 12, 8);
    ctx.strokeStyle = '#4a7a5a';
    ctx.lineWidth = 1;
    ctx.strokeRect(800, FLOOR_Y - 4, 12, 8);
  }

  // 7. Харон
  // Оставляем его стоять у шлагбаума, а не ходить (он NPC)
  drawCharon(720, FLOOR_Y - 32);

  // 8. Герой (отрисовка с камерой)
  drawHero(heroX, FLOOR_Y - 32, isWalking, heroDirection, walkTimer);

  ctx.restore();
}

/* ============ ИГРОВОЙ ЦИКЛ ============ */
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // Логика движения (герой идёт в таргет)
  if (targetX !== null) {
    const diff = targetX - heroX;
    const dist = Math.abs(diff);
    if (dist < 2) {
      heroX = targetX; targetX = null; isWalking = false;
      if (pendingClick) { const cb = pendingClick; pendingClick = null; cb(); }
    } else {
      const speed = 120; // пикселей в секунду
      const step = Math.min(dist, speed * dt);
      const dir = Math.sign(diff);
      heroDirection = dir;
      heroX += step * dir;
      isWalking = true;
      walkTimer += dt * 8;
    }
  } else {
    isWalking = false;
  }

  // Камера плавно следует за героем (держит его в центре)
  const targetCam = heroX - canvas.width / 2;
  cameraX += (targetCam - cameraX) * Math.min(1, dt * 4);
  cameraX = Math.max(0, Math.min(SCENE_WIDTH - canvas.width, cameraX));

  // Отрисовка
  drawWorld();

  requestAnimationFrame(tick);
}

/* ============ УПРАВЛЕНИЕ ============ */
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  // Перевод координат клика в мировые координаты
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width) + cameraX;
  
  targetX = clickX;
  pendingClick = null;
});

// Клики по хотспотам (ЛКМ)
// В пиксельной игре хотспоты лучше делать невидимыми DOM-элементами или проверять коллизии в canvas.
// Для простоты сделаем проверку попадания в bounding box при клике.
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width) + cameraX;
  const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  // Проверяем объекты
  const objects = [
    { id: 'horace', x: 500, y: FLOOR_Y - 130, w: 100, h: 130 },
    { id: 'charon', x: 720, y: FLOOR_Y - 64, w: 20, h: 64 },
    { id: 'keycard', x: 800, y: FLOOR_Y - 12, w: 12, h: 8, condition: !state.items.includes('keycard') },
    { id: 'barrier', x: 620, y: FLOOR_Y - 80, w: 130, h: 80 },
    { id: 'booth', x: 500, y: FLOOR_Y - 130, w: 100, h: 130 }, // будка и Гораций вместе
  ];

  for (let obj of objects) {
    if (obj.condition === false) continue;
    if (clickX >= obj.x && clickX <= obj.x + obj.w && clickY >= obj.y && clickY <= obj.y + obj.h) {
      // Идём к объекту
      const approachX = obj.x + obj.w / 2 - 15;
      targetX = approachX;
      pendingClick = () => interact(obj.id);
      return;
    }
  }
});

function interact(id) {
  const obj = gameObjects[id];
  if (!obj) return;
  if (obj.onClick) { obj.onClick(); return; }
  
  const first = !state.seen[id];
  let text;
  if (typeof obj.text === 'function') text = obj.text();
  else text = first ? obj.text : (obj.repeat || "Уже смотрел. Ничего нового.");
  if (first && obj.onFirst) obj.onFirst();
  state.seen[id] = true; save();
  say(text);
}

/* ============ ИГРОВЫЕ ОБЪЕКТЫ ============ */
const gameObjects = {
  forest: { text: "Сумрачный лес. Стволы уходят вверх и теряются в сером. Где-то там — небо, но его не видно." },
  booth: { text: "Будка КПП. Внутри сидит человек в форме. На табличке: «Гораций. Смена — вечная»." },
  horace: {
    onClick: () => {
      if (state.flags.barrierOpen) { say("— Проходи, — говорит Гораций. — Не задерживайся.", "Гораций"); return; }
      if (state.flags.horaceTalked && state.items.includes('keycard')) {
        if (!state.flags.stampGiven) {
          state.flags.stampGiven = true; state.flags.barrierOpen = true; save();
          say("Гораций ставит печать. Шлагбаум медленно поднимается.", "Гораций");
        }
        return;
      }
      if (state.flags.horaceTalked) { say("— Пропуск нужен. Без печати не подниму.", "Гораций"); return; }
      state.flags.horaceTalked = true; save();
      say("«Ещё один. Пропуск есть?» Ты мотаешь головой. «Тогда стой. Правила есть правила».", "Гораций");
    }
  },
  charon: {
    onClick: () => {
      if (!state.flags.charonTalked) {
        state.flags.charonTalked = true; save();
        say("«Ещё одна заблудшая душа. Привет. Я — Харон. Но сегодня шлагбаум закрыт — не моя воля».", "Харон");
      } else if (!state.items.includes('keycard')) {
        say("— Ключ-карта? Лежит где-то у дороги. Подбери — может, Гораций смилостивится.", "Харон");
      } else if (!state.flags.barrierOpen) {
        say("— Карта у тебя. Покажи Горацию — и он поставит печать.", "Харон");
      } else {
        say("— Шлагбаум поднят. Иди. Я буду ждать внизу, у реки.", "Харон");
      }
    }
  },
  keycard: {
    onClick: () => {
      if (state.items.includes('keycard')) { say("Ключ-карта уже у тебя."); return; }
      state.items.push('keycard'); save();
      renderInventory();
      say("Ты подобрал ключ-карту. Она холодная.");
    }
  },
  barrier: {
    text: () => state.flags.barrierOpen ? "Шлагбаум поднят." : "Шлагбаум опущен. Правила — у Горация."
  }
};

/* ============ ИНВЕНТАРЬ ============ */
const allItems = { keycard: { icon: '🗝', title: 'Ключ-карта', desc: 'Собственность КПП.' } };
function renderInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.items.forEach(id => {
    const item = allItems[id]; if (!item) return;
    const el = document.createElement('div');
    el.className = 'item-icon'; el.textContent = item.icon; el.title = item.title;
    el.addEventListener('click', () => {
      document.getElementById('modalText').innerHTML = `<h3>${item.title}</h3>${item.desc}`;
      document.getElementById('modal').classList.add('open');
    });
    inv.appendChild(el);
  });
}
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));

/* ============ СТАРТ ============ */
load();
if (state.cutsceneDone) {
  document.getElementById('cutscene').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  initGame();
} else {
  showCutscene();
}
</script>

</body>
</html>
