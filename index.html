<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты — Пролог (Пиксель)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070a; color: #c8ccd4; font-family: 'VT323', monospace;
    overflow: hidden; height: 100vh; user-select: none;
  }

  /* ===== КАТСЦЕНА ===== */
  #cutscene {
    position: fixed; inset: 0; z-index: 300; background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s;
  }
  #cutscene.hidden { opacity: 0; pointer-events: none; }
  #csBg { position: absolute; inset: 0; transition: background 1.2s; background: #0a0a0a; }
  #csText {
    position: absolute; bottom: 0; left: 0; right: 0; min-height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.92) 35%);
    padding: 50px 80px; font-size: 32px; line-height: 1.4;
    color: #d8dce4; display: flex; align-items: flex-end; z-index: 2;
  }
  #csText span { max-width: 900px; }
  #csNext {
    position: absolute; bottom: 30px; right: 60px; color: #6b7f9e; font-size: 24px;
    font-style: italic; cursor: pointer; z-index: 3; animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* ===== ИГРА ===== */
  #game {
    position: fixed; inset: 0; opacity: 1; transition: opacity 1.5s;
    overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000;
  }
  #game.hidden { opacity: 0; pointer-events: none; }

  #gameCanvas {
    display: block; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #1a2b22; /* Сделали фон светлее */
  }

  #uiOverlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
  }

  #textPanel {
    pointer-events: none; min-height: 80px; background: rgba(5,7,10,0.85);
    border: 2px solid #4a6a5a; padding: 20px 30px; font-size: 28px; line-height: 1.3;
    color: #d0d8d4; margin-top: auto; max-width: 800px; align-self: center; width: 100%;
    border-radius: 6px; transition: opacity 0.5s;
    opacity: 0; /* Изначально скрыто */
  }
  #textPanel.show { opacity: 1; }
  #textPanel .speaker { color: #8ab89a; font-style: italic; }

  #inventory { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  .item-icon {
    width: 48px; height: 48px; background: #2a3b33; border: 2px solid #4a6a5a;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; transition: all 0.2s;
  }
  .item-icon:hover { border-color: #8ab89a; box-shadow: 0 0 12px rgba(138,184,154,0.5); }

  #locTitle {
    position: absolute; top: 20px; left: 20px; font-size: 20px; letter-spacing: 2px;
    text-transform: uppercase; color: #6a8a7a;
  }
  #controls {
    position: absolute; top: 50px; left: 20px; font-size: 18px; color: #5a7a6a; line-height: 1.5;
  }
  #controls b { color: #8ab89a; }
</style>
</head>
<body>

<div id="cutscene">
  <div id="csBg"></div>
  <div id="csText"><span id="csTextContent"></span></div>
  <div id="csNext">нажми, чтобы продолжить →</div>
</div>

<div id="game" class="hidden">
  <canvas id="gameCanvas"></canvas>
  
  <div id="uiOverlay">
    <div>
      <div id="locTitle">Пролог · Сумрачный лес — КПП</div>
      <div id="controls"><b>WASD</b> — идти · <b>ЛКМ по объекту</b> — осмотреть</div>
    </div>
    <div id="inventory"></div>
    <div id="textPanel"><span id="textContent"></span></div>
  </div>
</div>

<script>
/* ============ СОСТОЯНИЕ ============ */
const state = {
  seen: {}, items: [], flags: {}, cutsceneDone: false,
  hero: { x: 200, y: 200 } // Добавили ось Y (глубину)
};
const SAVE_KEY = 'kto_ty_pixel_v3';
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch(e) {} }
}

/* ============ ТЕКСТ ============ */
let typeTimer = null;
let hidePanelTimer = null;

function say(text, speaker) {
  const panel = document.getElementById('textPanel');
  const el = document.getElementById('textContent');
  const prefix = speaker ? `<span class="speaker">${speaker}:</span> ` : '';
  
  el.innerHTML = ''; let i = 0;
  clearInterval(typeTimer);
  clearTimeout(hidePanelTimer);
  
  panel.classList.add('show');

  typeTimer = setInterval(() => {
    if (i >= text.length) { 
      clearInterval(typeTimer); 
      // Скрываем панель через 5 секунд после окончания печати
      hidePanelTimer = setTimeout(() => {
        panel.classList.remove('show');
      }, 5000);
      return; 
    }
    el.innerHTML = prefix + text.slice(0, i + 1); i++;
  }, 25);
}

function typeInto(el, text, speed = 40, cb) {
  clearInterval(typeTimer); el.innerHTML = ''; let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); if (cb) cb(); return; }
    el.innerHTML = text.slice(0, i + 1); i++;
  }, speed);
}

/* ============ КАТСЦЕНА ============ */
const cutscene = [
  { bg: 'radial-gradient(circle at 50% 40%, #1a1410 0%, #050302 70%)', text: 'Ты не помнишь своего имени. Никто здесь его не помнит. Имени больше нет — есть только «ты».' },
  { bg: 'radial-gradient(circle at 50% 30%, #2a1a10 0%, #0a0604 70%)', text: 'Ты жил. Как все: дышал, забывал, обещал. Кому-то — важное. Кому-то — пустое.' },
  { bg: 'radial-gradient(circle at 50% 50%, #3a0a0a 0%, #0a0202 70%)', text: 'А потом — тишина. Не тьма, не свет. Просто тишина, в которой ты перестал быть.' },
  { bg: 'radial-gradient(circle at 50% 60%, #2a0a0a 0%, #050202 70%)', text: 'И вот ты здесь. Внизу. Там, где начинается всё, что ты откладывал.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a1a10 0%, #020604 70%)', text: 'Ты помнишь только её. Не лицо, не имя. Только тепло. И что-то в груди говорит: иди.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a1a10 0%, #020604 70%)', text: 'Сумрачный лес. КПП. Начало.' },
];
let csIndex = 0;
const csBg = document.getElementById('csBg');
const csTextContent = document.getElementById('csTextContent');
const csNext = document.getElementById('csNext');

function showCutscene() {
  document.getElementById('cutscene').classList.remove('hidden');
  document.getElementById('game').classList.add('hidden');
  csIndex = 0; renderCsSlide();
}
function renderCsSlide() {
  const slide = cutscene[csIndex];
  csBg.style.background = slide.bg;
  csNext.style.display = 'none';
  typeInto(csTextContent, slide.text, 40, () => { csNext.style.display = 'block'; });
}
csNext.addEventListener('click', () => {
  if (csIndex < cutscene.length - 1) { csIndex++; renderCsSlide(); }
  else {
    document.getElementById('cutscene').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    state.cutsceneDone = true; save();
    initGame();
  }
});

/* ============ ИГРА / CANVAS ============ */
const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');
const SCENE_WIDTH = 1600;
const SCENE_HEIGHT = 600; // Мир стал глубже (камера сверху)

// Позиция героя в мире
let heroX = 300;
let heroY = 400; 
let heroSpeed = 150; // Скорость ходьбы
let isWalking = false;
let heroDirection = 1; // 1 вправо, -1 влево
let walkTimer = 0;

// Камера
let cameraX = 0;
let cameraY = 0;
let lastTime = performance.now();

// Управление
const keys = { w: false, a: false, s: false, d: false };

/* ============ ЗАГРУЗКА СПРАЙТОВ ============ */
const imgHero = new Image();
const imgCharon = new Image();
imgHero.src = 'hero.png'; 
imgCharon.src = 'charon.png';

let imagesLoaded = false;
let loadCount = 0;

function processImage(img) {
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = img.width;
  tempCanvas.height = img.height;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(img, 0, 0);
  const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
  const data = imgData.data;
  for (let y = 0; y < tempCanvas.height; y++) {
    for (let x = 0; x < tempCanvas.width; x++) {
      const i = (y * tempCanvas.width + x) * 4;
      if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) {
        if (x < 15 || x > tempCanvas.width - 15 || y < 15 || y > tempCanvas.height - 15) {
          data[i+3] = 0; 
        }
      }
    }
  }
  tempCtx.putImageData(imgData, 0, 0);
  return tempCanvas;
}

function checkLoaded() { loadCount++; if (loadCount >= 2) imagesLoaded = true; }
imgHero.onload = checkLoaded; imgCharon.onload = checkLoaded;
imgHero.onerror = () => { console.error('Нет hero.png'); checkLoaded(); };
imgCharon.onerror = () => { console.error('Нет charon.png'); checkLoaded(); };

let heroSprite = null;
let charonSprite = null;

function initGame() {
  load();
  heroX = state.hero?.x ?? 300;
  heroY = state.hero?.y ?? 400;
  
  gameCanvas.width = 640; // Увеличили разрешение для камеры сверху
  gameCanvas.height = 360;
  
  renderInventory();
  say("Сумрачный лес. Деревья стоят плотно. Перед тобой — КПП и шлагбаум. Используй WASD для движения.");
  requestAnimationFrame(tick);
}

/* ============ ОТРИСОВКА ПЕРСОНАЖЕЙ ============ */
function drawHero(x, y, isWalking, direction, walkTimer) {
  if (imagesLoaded && imgHero.complete && !heroSprite) heroSprite = processImage(imgHero);

  ctx.save();
  ctx.translate(x, y);
  
  let tilt = isWalking ? Math.sin(walkTimer) * 0.15 : 0;
  let bounce = isWalking ? Math.abs(Math.sin(walkTimer * 2)) * 2 : 0;
  ctx.rotate(tilt * direction);
  ctx.translate(0, -bounce);

  if (direction < 0) ctx.scale(-1, 1);

  if (heroSprite) {
    const w = 60; // Сделали чуть крупнее
    const h = 90;
    ctx.drawImage(heroSprite, -w / 2, -h, w, h);
  } else {
    ctx.fillStyle = '#ff2222';
    ctx.beginPath(); ctx.arc(0, -20, 10, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawCharon(x, y, isWalking, walkTimer) {
  if (imagesLoaded && imgCharon.complete && !charonSprite) charonSprite = processImage(imgCharon);

  ctx.save();
  ctx.translate(x, y);
  
  let tilt = Math.sin(walkTimer * 0.5) * 0.05;
  ctx.rotate(tilt);

  if (charonSprite) {
    const w = 65; 
    const h = 100;
    ctx.drawImage(charonSprite, -w / 2, -h, w, h);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, -20, 10, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
 
/* ============ ОТРИСОВКА МИРА ============ */
function drawWorld() {
  // Светлый фон неба/леса
  const skyGrad = ctx.createLinearGradient(0, 0, 0, SCENE_HEIGHT);
  skyGrad.addColorStop(0, '#14201a');
  skyGrad.addColorStop(1, '#2a4034');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

  ctx.save();
  ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

  // Деревья (теперь по всей площади)
  ctx.fillStyle = '#1f3028';
  for (let i = 0; i < 15; i++) {
    for (let j = 0; j < 3; j++) {
      const tx = i * 120 + Math.sin(i*3) * 30;
      const ty = j * 200 + Math.cos(i) * 20;
      ctx.fillRect(tx, ty, 25, 150); // Ствол
      ctx.beginPath(); ctx.arc(tx + 12, ty, 50, 0, Math.PI * 2); ctx.fill(); // Крона
    }
  }

  // Земля (низ экрана)
  ctx.fillStyle = '#2a3c34';
  ctx.fillRect(0, 500, SCENE_WIDTH, 100);

  // КПП (Сдвинули по Y)
  ctx.fillStyle = '#3a5a4a';
  ctx.fillRect(600, 380, 120, 140);
  ctx.fillStyle = '#4a7a5a';
  ctx.fillRect(590, 370, 140, 10);
  ctx.fillStyle = '#6a9a7a';
  ctx.fillRect(620, 410, 80, 50);

  // Шлагбаум (Сдвинули по Y)
  ctx.fillStyle = '#2a4a3a';
  ctx.fillRect(740, 450, 12, 90);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#8a2020' : '#e0e0e0';
    if (state.flags.barrierOpen) {
      ctx.fillRect(745, 450 - i * 12, 10, 12);
    } else {
      ctx.fillRect(750 + i * 25, 470, 25, 10);
    }
  }

  // Ключ-карта
  if (!state.items.includes('keycard')) {
    ctx.fillStyle = '#6aba7a';
    ctx.fillRect(950, 510, 16, 10);
    ctx.strokeStyle = '#a0e0a0'; ctx.lineWidth = 2;
    ctx.strokeRect(950, 510, 16, 10);
  }

  // Персонажи
  drawCharon(820, 490);
  drawHero(heroX, heroY, isWalking, heroDirection, walkTimer);

  ctx.restore();
}

/* ============ ЛОГИКА И ЦИКЛ ============ */
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // Движение на WASD
  let dx = 0;
  let dy = 0;
  if (keys.a) { dx -= 1; heroDirection = -1; }
  if (keys.d) { dx += 1; heroDirection = 1; }
  if (keys.w) { dy -= 1; }
  if (keys.s) { dy += 1; }

  if (dx !== 0 || dy !== 0) {
    // Нормализация диагонали, чтобы не было быстрее
    const length = Math.sqrt(dx*dx + dy*dy);
    dx /= length;
    dy /= length;

    heroX += dx * heroSpeed * dt;
    heroY += dy * heroSpeed * dt;
    isWalking = true;
    walkTimer += dt * 12;
  } else {
    isWalking = false;
  }

  // Ограничение мира (чтобы не уйти за края)
  heroX = Math.max(50, Math.min(SCENE_WIDTH - 50, heroX));
  heroY = Math.max(200, Math.min(550, heroY)); // Ограничиваем глубину (верх/низ)

  // Камера следует за героем
  const targetCamX = heroX - gameCanvas.width / 2;
  const targetCamY = heroY - gameCanvas.height / 2;
  
  cameraX += (targetCamX - cameraX) * Math.min(1, dt * 5);
  cameraY += (targetCamY - cameraY) * Math.min(1, dt * 5);
  
  // Ограничение камеры
  cameraX = Math.max(0, Math.min(SCENE_WIDTH - gameCanvas.width, cameraX));
  cameraY = Math.max(0, Math.min(SCENE_HEIGHT - gameCanvas.height, cameraY));

  drawWorld();
  requestAnimationFrame(tick);
}

/* ============ ВВОД КЛАВИАТУРЫ ============ */
window.addEventListener('keydown', (e) => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = true;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = true;
  if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = true;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = false;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = false;
  if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = false;
});

/* ============ КЛИКИ (ВЗАИМОДЕЙСТВИЕ) ============ */
gameCanvas.addEventListener('click', (e) => {
  const rect = gameCanvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (gameCanvas.width / rect.width) + cameraX;
  const clickY = (e.clientY - rect.top) * (gameCanvas.height / rect.height) + cameraY;

  // Объекты с новыми координатами (x, y, ширина, высота)
  const objects = [
    { id: 'horace', x: 600, y: 380, w: 120, h: 140 },
    { id: 'charon', x: 800, y: 400, w: 60, h: 100 },
    { id: 'keycard', x: 950, y: 500, w: 20, h: 20, condition: !state.items.includes('keycard') },
    { id: 'barrier', x: 740, y: 450, w: 150, h: 90 },
    { id: 'booth', x: 600, y: 380, w: 120, h: 140 },
  ];

  for (let obj of objects) {
    if (obj.condition === false) continue;
    // Проверяем клик по объекту
    if (clickX >= obj.x && clickX <= obj.x + obj.w && clickY >= obj.y && clickY <= obj.y + obj.h) {
      interact(obj.id);
      return;
    }
  }
});

function interact(id) {
  const obj = gameObjects[id];
  if (!obj) return;
  if (obj.onClick) { obj.onClick(); return; }
  const first = !state.seen[id];
  let text;
  if (typeof obj.text === 'function') text = obj.text();
  else text = first ? obj.text : (obj.repeat || "Уже смотрел. Ничего нового.");
  if (first && obj.onFirst) obj.onFirst();
  state.seen[id] = true; save();
  say(text);
}

const gameObjects = {
  forest: { text: "Сумрачный лес. Стволы уходят вверх и теряются в сером." },
  booth: { text: "Будка КПП. Внутри сидит человек в форме. На табличке: «Гораций. Смена — вечная»." },
  horace: {
    onClick: () => {
      if (state.flags.barrierOpen) { say("— Проходи, — говорит Гораций.", "Гораций"); return; }
      if (state.flags.horaceTalked && state.items.includes('keycard')) {
        if (!state.flags.stampGiven) {
          state.flags.stampGiven = true; state.flags.barrierOpen = true; save();
          say("Гораций ставит печать. Шлагбаум медленно поднимается.", "Гораций");
        }
        return;
      }
      if (state.flags.horaceTalked) { say("— Пропуск нужен.", "Гораций"); return; }
      state.flags.horaceTalked = true; save();
      say("«Ещё один. Пропуск есть?» Ты мотаешь головой. «Тогда стой».", "Гораций");
    }
  },
  charon: {
    onClick: () => {
      if (!state.flags.charonTalked) {
        state.flags.charonTalked = true; save();
        say("«Ещё одна заблудшая душа. Привет. Я — Харон. Но сегодня шлагбаум закрыт — не моя воля».", "Харон");
      } else if (!state.items.includes('keycard')) {
        say("— Ключ-карта? Лежит где-то у дороги.", "Харон");
      } else if (!state.flags.barrierOpen) {
        say("— Карта у тебя. Покажи Горацию.", "Харон");
      } else {
        say("— Шлагбаум поднят. Иди. Я буду ждать внизу.", "Харон");
      }
    }
  },
  keycard: {
    onClick: () => {
      if (state.items.includes('keycard')) { say("Ключ-карта уже у тебя."); return; }
      state.items.push('keycard'); save(); renderInventory();
      say("Ты подобрал ключ-карту. Она холодная.");
    }
  },
  barrier: {
    text: () => state.flags.barrierOpen ? "Шлагбаум поднят." : "Шлагбаум опущен."
  }
};

/* ============ ИНВЕНТАРЬ ============ */
const allItems = { keycard: { icon: '🗝', title: 'Ключ-карта', desc: 'Собственность КПП.' } };
function renderInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.items.forEach(id => {
    const item = allItems[id]; if (!item) return;
    const el = document.createElement('div');
    el.className = 'item-icon'; el.textContent = item.icon; el.title = item.title;
    el.addEventListener('click', () => {
      document.getElementById('modalText').innerHTML = `<h3>${item.title}</h3>${item.desc}`;
      document.getElementById('modal').classList.add('open');
    });
    inv.appendChild(el);
  });
}
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));

/* ============ СТАРТ ============ */
load();
if (state.cutsceneDone) {
  document.getElementById('cutscene').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  initGame();
} else {
  showCutscene();
}
</script>

</body>
</html>
