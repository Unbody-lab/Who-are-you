<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты — Пролог (Пиксель)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brightness: 1;
  }

  body {
    background: #020202; color: #8a8a8a; font-family: 'VT323', monospace;
    overflow: hidden; height: 100vh; user-select: none;
    filter: brightness(var(--brightness));
    transition: filter 0.3s;
  }

  /* ===== ГЛАВНОЕ МЕНЮ ===== */
  #mainMenu {
    position: fixed; inset: 0; z-index: 400;
    background: #050202; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #mainMenu h1 {
    font-size: 64px; color: #8a3030; margin-bottom: 50px; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(138,48,48,0.5);
  }
  .menu-btn {
    background: transparent; border: 2px solid #3a1010; color: #a08080;
    padding: 15px 40px; font-size: 32px; font-family: 'VT323', monospace;
    cursor: pointer; margin: 10px; width: 300px; transition: all 0.2s;
  }
  .menu-btn:hover {
    background: #3a1010; color: #fff; box-shadow: 0 0 15px #8a3030;
  }

  /* ===== ЭКРАН ВЫБОРА ГЛАВ ===== */
  #chapterSelect {
    position: fixed; inset: 0; z-index: 350;
    background: #050202; display: none; flex-direction: column;
    align-items: center; padding: 40px;
    overflow-y: auto; 
  }
  #chapterSelect h2 {
    font-size: 40px; color: #a08080; margin-bottom: 30px;
    flex-shrink: 0;
  }

  .circle-block {
    width: 100%; max-width: 1200px; margin-bottom: 30px;
    background: #110b0b; border: 2px solid #2a1515; border-radius: 8px;
    padding: 20px; display: flex; flex-direction: column;
  }
  .circle-block.locked {
    opacity: 0.6; filter: grayscale(0.8);
  }
  .circle-title {
    font-size: 32px; color: #d08080; margin-bottom: 15px;
    border-bottom: 1px solid #3a1010; padding-bottom: 10px;
  }

  .locations-row {
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  .location-card {
    background: #1a1010; border: 2px solid #3a1010;
    width: 280px; border-radius: 4px; overflow: hidden;
    display: flex; flex-direction: column; transition: all 0.2s;
  }
  .location-card.active {
    cursor: pointer;
  }
  .location-card.active:hover {
    border-color: #8a3030; box-shadow: 0 0 15px rgba(138,48,48,0.5); transform: scale(1.02);
  }
  .location-card.locked {
    cursor: not-allowed; border-color: #222;
  }
  .loc-img {
    width: 100%; height: 140px; object-fit: cover;
    border-bottom: 2px solid #3a1010; background: #111;
    display: flex; align-items: center; justify-content: center;
    color: #444; font-size: 20px;
  }
  .location-card.active .loc-img {
    background: #1a1010;
  }
  .loc-info {
    padding: 15px; display: flex; flex-direction: column; gap: 5px;
  }
  .loc-title {
    font-size: 24px; color: #d08080;
  }
  .loc-desc {
    font-size: 18px; color: #a08080; font-style: italic;
  }
  .loc-status {
    font-size: 18px; color: #5a8080; margin-top: 5px;
  }

  /* ===== НАСТРОЙКИ ===== */
  #settings {
    position: fixed; inset: 0; z-index: 350;
    background: #050202; display: none; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #settings h2 {
    font-size: 40px; color: #a08080; margin-bottom: 30px;
  }
  .setting-row {
    display: flex; align-items: center; gap: 20px; margin-bottom: 20px;
    font-size: 24px;
  }
  input[type=range] {
    width: 300px; accent-color: #8a3030;
  }

  /* ===== КАТСЦЕНА ===== */
  #cutscene {
    position: fixed; inset: 0; z-index: 300; background: #000;
    display: none; align-items: center; justify-content: center;
    transition: opacity 1.5s;
  }
  #cutscene.hidden { opacity: 0; pointer-events: none; }
  #csBg { position: absolute; inset: 0; transition: background 1.2s; background: #0a0a0a; }
  #csText {
    position: absolute; bottom: 0; left: 0; right: 0; min-height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 40%);
    padding: 50px 80px; font-size: 32px; line-height: 1.4;
    color: #a0a0a0; display: flex; align-items: flex-end; z-index: 2;
  }
  #csText span { max-width: 900px; }
  #csNext {
    position: absolute; bottom: 30px; right: 60px; color: #5a2020; font-size: 24px;
    font-style: italic; cursor: pointer; z-index: 3; animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* ===== ИГРА ===== */
  #game {
    position: fixed; inset: 0; opacity: 1; transition: opacity 1.5s;
    overflow: hidden; display: none; align-items: center; justify-content: center; background: #000;
  }
  #game.hidden { opacity: 0; pointer-events: none; }

  #gameCanvas {
    display: block; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  #uiOverlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
  }

  #topBar {
    display: flex; justify-content: space-between;
    background: rgba(10, 5, 5, 0.85); border: 2px solid #3a1010; border-radius: 8px;
    padding: 10px 20px; color: #a08080; font-size: 22px;
  }

  #textPanel {
    pointer-events: none; min-height: 80px; background: rgba(5,2,2,0.9);
    border: 2px solid #4a1515; padding: 20px 30px; font-size: 28px; line-height: 1.3;
    color: #b0a0a0; margin-top: auto; max-width: 800px; align-self: center; width: 100%;
    border-radius: 6px; transition: opacity 0.5s; opacity: 0;
  }
  #textPanel.show { opacity: 1; }
  #textPanel .speaker { color: #8a3030; font-style: italic; }

  #inventory { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  .item-icon {
    width: 48px; height: 48px; background: #1a1010; border: 2px solid #4a2020;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; transition: all 0.2s;
  }
  .item-icon:hover { border-color: #8a3030; box-shadow: 0 0 12px rgba(138,48,48,0.5); }

  #fadeOverlay {
    position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity 0.8s; z-index: 200;
  }
  #fadeOverlay.active { opacity: 1; }
</style>
</head>
<body>

<!-- ================= ГЛАВНОЕ МЕНЮ ================= -->
<div id="mainMenu">
  <h1>КТО ТЫ</h1>
  <button class="menu-btn" id="btnPlay">Играть</button>
  <button class="menu-btn" id="btnSettings">Настройки</button>
</div>

<!-- ================= ВЫБОР ГЛАВ ================= -->
<div id="chapterSelect">
  <h2>Выбор главы</h2>
  <div id="chaptersContainer"></div>
  <button class="menu-btn" style="width:200px; margin-bottom: 30px;" id="btnBackFromChapters">Назад</button>
</div>

<!-- ================= НАСТРОЙКИ ================= -->
<div id="settings">
  <h2>Настройки</h2>
  <div class="setting-row">
    <span>Яркость:</span>
    <input type="range" id="brightnessSlider" min="0.3" max="1.5" step="0.1" value="1">
  </div>
  <button class="menu-btn" style="width:200px; margin-top:30px;" id="btnBackFromSettings">Назад</button>
</div>

<!-- ================= КАТСЦЕНА ================= -->
<div id="cutscene">
  <div id="csBg"></div>
  <div id="csText"><span id="csTextContent"></span></div>
  <div id="csNext">нажми, чтобы продолжить →</div>
</div>

<!-- ================= ИГРА ================= -->
<div id="game">
  <canvas id="gameCanvas"></canvas>

  <div id="uiOverlay">
    <div id="topBar">
      <div id="locName">Пролог</div>
      <div id="locGoal">Сумрачный лес</div>
    </div>

    <div id="inventory"></div>
    <div id="heroControls" style="position:absolute;left:20px;bottom:20px;color:#806060;font-size:18px;background:rgba(5,2,2,.65);padding:8px 12px;border:1px solid #3a1010;border-radius:4px;">WASD — движение · Space — прыжок · J — атака</div>
    <div id="textPanel"><span id="textContent"></span></div>
  </div>
  <div id="fadeOverlay"></div>
</div>

<!-- АУДИО ТЕГИ -->
<audio id="bgmIntro" src="intro.mp3" loop></audio>
<audio id="bgmForest" src="forest_ambient.mp3" loop></audio>

<script>
/* ============ АУДИО И НАСТРОЙКИ ============ */
const audioIntro = document.getElementById('bgmIntro');
const audioForest = document.getElementById('bgmForest');
audioIntro.volume = 0.6;
audioForest.volume = 0.4;

let isAudioStarted = false;
function playIntroMusic() {
  if (isAudioStarted) return;
  isAudioStarted = true;
  audioIntro.play().catch(e => console.log("Аудио заблокировано"));
}
function playForestMusic() {
  if (!audioIntro.paused) audioIntro.pause();
  audioForest.currentTime = 0;
  audioForest.play().catch(e => console.log("Ошибка аудио"));
}

const slider = document.getElementById('brightnessSlider');
slider.addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--brightness', e.target.value);
});

/* ============ НАВИГАЦИЯ МЕНЮ ============ */
document.getElementById('btnPlay').addEventListener('click', () => {
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('chapterSelect').style.display = 'flex';
  renderChapters();
});
document.getElementById('btnSettings').addEventListener('click', showSettings);
document.getElementById('btnBackFromChapters').addEventListener('click', hideChapters);
document.getElementById('btnBackFromSettings').addEventListener('click', hideSettings);

function hideChapters() {
  document.getElementById('chapterSelect').style.display = 'none';
  document.getElementById('mainMenu').style.display = 'flex';
}
function showSettings() {
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('settings').style.display = 'flex';
}
function hideSettings() {
  document.getElementById('settings').style.display = 'none';
  document.getElementById('mainMenu').style.display = 'flex';
}

/* ============ СПИСОК ГЛАВ ============ */
const chaptersData = [
  {
    title: 'Пролог',
    locked: false,
    locations: [
      { title: 'Сумрачный лес', desc: 'Вы очутились в странном лесу...', available: true, img: 'loc_forest.png' },
      { title: '???', desc: 'В разработке', available: false, img: null }
    ]
  },
  {
    title: '1 Круг · Лимб',
    locked: true,
    locations: [
      { title: '???', desc: 'В разработке', available: false, img: null }
    ]
  }
];

function renderChapters() {
  const container = document.getElementById('chaptersContainer');
  container.innerHTML = '';
  chaptersData.forEach(circle => {
    const block = document.createElement('div');
    block.className = 'circle-block' + (circle.locked ? ' locked' : '');
    const title = document.createElement('div');
    title.className = 'circle-title';
    title.textContent = circle.title;
    block.appendChild(title);

    const row = document.createElement('div');
    row.className = 'locations-row';

    circle.locations.forEach(loc => {
      const card = document.createElement('div');
      card.className = 'location-card ' + (loc.available ? 'active' : 'locked');

      const imgDiv = document.createElement('div');
      imgDiv.className = 'loc-img';
      if (loc.img) {
        const img = document.createElement('img');
        img.src = loc.img;
        img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
        img.onerror = () => { img.style.display = 'none'; imgDiv.textContent = 'Нет изображения'; };
        imgDiv.appendChild(img);
      } else {
        imgDiv.textContent = '???';
      }

      const infoDiv = document.createElement('div');
      infoDiv.className = 'loc-info';
      infoDiv.innerHTML = `<div class="loc-title">${loc.title}</div><div class="loc-desc">${loc.desc}</div><div class="loc-status">${loc.available ? 'Доступно' : 'В разработке'}</div>`;

      card.appendChild(imgDiv);
      card.appendChild(infoDiv);

      if (loc.available) {
        card.addEventListener('click', () => {
          document.getElementById('chapterSelect').style.display = 'none';
          document.getElementById('cutscene').style.display = 'flex';
          playIntroMusic();
          showCutscene();
        });
      }
      row.appendChild(card);
    });
    block.appendChild(row);
    container.appendChild(block);
  });
}

/* ============ СОСТОЯНИЕ ============ */
const state = {
  seen: {}, items: [], flags: {}, cutsceneDone: false,
  hero: { x: 500, y: 1000 }
};
const SAVE_KEY = 'kto_ty_pixel_dante_v5';
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch(e) {} }
}

/* ============ ТЕКСТ ============ */
let typeTimer = null, hidePanelTimer = null;
function say(text, speaker) {
  const panel = document.getElementById('textPanel');
  const el = document.getElementById('textContent');
  const prefix = speaker ? `<span class="speaker">${speaker}:</span> ` : '';
  el.innerHTML = ''; let i = 0;
  clearInterval(typeTimer); clearTimeout(hidePanelTimer);
  panel.classList.add('show');
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); hidePanelTimer = setTimeout(() => { panel.classList.remove('show'); }, 7000); return; }
    el.innerHTML = prefix + text.slice(0, i + 1); i++;
  }, 25);
}
function typeInto(el, text, speed = 40, cb) {
  clearInterval(typeTimer); el.innerHTML = ''; let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); if (cb) cb(); return; }
    el.innerHTML = text.slice(0, i + 1); i++;
  }, speed);
}

/* ============ КАТСЦЕНА ============ */
const cutsceneData = [
  { bg: 'radial-gradient(circle at 50% 40%, #1a1010 0%, #000 70%)', text: 'Ты не помнишь своего имени. Никто здесь его не помнит. Имени больше нет — есть только «ты».' },
  { bg: 'radial-gradient(circle at 50% 30%, #2a1010 0%, #000 70%)', text: 'Ты жил. Как все: дышал, забывал, обещал. Кому-то — важное. Кому-то — пустое.' },
  { bg: 'radial-gradient(circle at 50% 50%, #3a0505 0%, #000 70%)', text: 'А потом — тишина. Не тьма, не свет. Просто тишина, в которой ты перестал быть.' },
  { bg: 'radial-gradient(circle at 50% 60%, #2a0505 0%, #000 70%)', text: 'И вот ты здесь. Внизу. Там, где начинается всё, что ты откладывал.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a0a0a 0%, #000 70%)', text: 'Сумрачный лес. КПП. Начало.' },
];
let csIndex = 0;
const csBg = document.getElementById('csBg');
const csTextContent = document.getElementById('csTextContent');
const csNext = document.getElementById('csNext');

function showCutscene() { csIndex = 0; renderCsSlide(); }
function renderCsSlide() {
  const slide = cutsceneData[csIndex];
  csBg.style.background = slide.bg;
  csNext.style.display = 'none';
  typeInto(csTextContent, slide.text, 40, () => { csNext.style.display = 'block'; });
}
csNext.addEventListener('click', (e) => {
  e.stopPropagation();
  if (csIndex < cutsceneData.length - 1) { csIndex++; renderCsSlide(); }
  else {
    document.getElementById('cutscene').style.display = 'none';
    document.getElementById('game').style.display = 'flex';
    state.cutsceneDone = true; save();
    playForestMusic();
    initGame();
  }
});

/* ============ ИГРА / CANVAS ============ */
const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');

let currentZone = 'outside'; 
const WORLD = {
  outside: { width: 6000, height: 2000, minY: 820, maxY: 1900 },
  inside: { width: 1200, height: 800, minY: 500, maxY: 750 }
};

let heroX = 500, heroY = 1000, heroSpeed = 180; 
let isWalking = false, heroDirection = 1, walkTimer = 0;
let cameraX = 0, cameraY = 0;
let lastTime = performance.now();
const keys = { w: false, a: false, s: false, d: false };

/* ============ ЗАГРУЗКА СПРАЙТОВ ГЕРОЯ ============ */
const heroAnimations = {};
const heroAnimationNames = [
  'walk_down','walk_up','walk_left','walk_right',
  'jump','attack','crouch','pickup_item','knocked_out','wake_up','stand_up','dead'
];
// Количество кадров для каждой анимации (согласно твоей папке)
const heroFrameCounts = {
  walk_down:4, walk_up:4, walk_left:4, walk_right:4,
  jump:2, attack:3, crouch:2, pickup_item:2,
  knocked_out:2, wake_up:3, stand_up:2, dead:2
};

heroAnimationNames.forEach(name => {
  heroAnimations[name] = [];
  for (let i = 1; i <= heroFrameCounts[name]; i++) {
    const frame = new Image();
    // Формируем путь: assets/hero/walk_down/walk_down_01.png
    frame.src = `assets/hero/${name}/${name}_${String(i).padStart(2,'0')}.png`;
    heroAnimations[name].push(frame);
  }
});

/* ============ ЗВЁЗДЫ И ДЕРЕВЬЯ ============ */
const stars = [];
function initStars() {
  stars.length = 0;
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * WORLD.outside.width,
      y: Math.random() * 500,
      size: Math.random() * 2 + 1,
      baseAlpha: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 2 + 0.5,
      phase: Math.random() * Math.PI * 2
    });
  }
}
initStars();

const trees = [];
function initTrees() {
  trees.length = 0;
  const pathLeft = 1700, pathRight = 4300;

  for (let i = 0; i < 35; i++) {
    const isLeft = Math.random() > 0.5;
    const x = isLeft ? Math.random() * pathLeft : pathRight + Math.random() * (WORLD.outside.width - pathRight);
    trees.push({ x: x, y: 850 + Math.random() * 250, scale: 0.35, seed: i });
  }
  for (let i = 0; i < 28; i++) {
    const isLeft = Math.random() > 0.5;
    const x = isLeft ? Math.random() * (pathLeft + 200) : (pathRight - 200) + Math.random() * (WORLD.outside.width - pathRight + 200);
    trees.push({ x: x, y: 950 + Math.random() * 350, scale: 0.6, seed: i + 100 });
  }
  for (let i = 0; i < 18; i++) {
    const isLeft = Math.random() > 0.5;
    const x = isLeft ? Math.random() * (pathLeft - 100) : (pathRight + 100) + Math.random() * (WORLD.outside.width - pathRight - 100);
    trees.push({ x: x, y: 1100 + Math.random() * 450, scale: 0.85, seed: i + 200 });
  }
  trees.sort((a, b) => a.y - b.y);
}
initTrees();

/* ============ ЗАГРУЗКА ОСТАЛЬНЫХ АССЕТОВ ============ */
const imgCharon = new Image();
const imgTree = new Image();
imgCharon.src = 'charon.png';
imgTree.src = 'tree.png';

let imagesLoaded = false, loadCount = 0;
const totalImages = 2; // Герой грузится отдельно массивом

function processImage(img) {
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = img.width; tempCanvas.height = img.height;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(img, 0, 0);
  const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i] > 230 && data[i+1] > 230 && data[i+2] > 230) data[i+3] = 0;
  }
  tempCtx.putImageData(imgData, 0, 0);
  return tempCanvas;
}

function checkLoaded() { loadCount++; if (loadCount >= totalImages) imagesLoaded = true; }
imgCharon.onload = checkLoaded; imgTree.onload = checkLoaded;
imgCharon.onerror = () => { console.error('Нет charon.png'); checkLoaded(); };
imgTree.onerror = () => { console.error('Нет tree.png'); checkLoaded(); };

let charonSprite = null, treeSprite = null;

/* ============ ЛОГИКА АНИМАЦИЙ ГЕРОЯ ============ */
let heroFacing = 'down';
let heroAction = null;
let heroActionTimer = 0;
let heroDead = false;
let isAwake = false; // Флаг для стартовой анимации
let gameStarted = false; // Блокировка управления до пробуждения

function playHeroAction(name, duration = 0.7) {
  if (!isAwake && name !== 'wake_up') return; // Нельзя действовать, пока лежим
  if (heroDead && name !== 'wake_up' && name !== 'stand_up') return;
  
  heroAction = name;
  heroActionTimer = duration;
  if (name === 'dead') heroDead = true;
  if (name === 'wake_up') heroDead = false;
}

function heroActionDuration(name) {
  return ({ jump:0.65, attack:0.42, pickup_item:0.65, knocked_out:0.8,
    wake_up:0.9, stand_up:0.65, dead:1.2 })[name] || 0.7;
}

function initGame() {
  load();
  heroX = state.hero?.x ?? 500;
  heroY = state.hero?.y ?? 1000;
  gameCanvas.width = 1280; gameCanvas.height = 720;
  
  renderInventory();
  
  // Запускаем анимацию пробуждения
  isAwake = false;
  gameStarted = false;
  heroAction = 'dead'; // Лежим без сознания
  heroActionTimer = 999; // Держим кадр
  document.getElementById('textContent').innerHTML = "Ты открываешь глаза... (Нажми любую клавишу или кликни, чтобы встать)";
  document.getElementById('textPanel').classList.add('show');

  requestAnimationFrame(tick);
}

/* ============ ОТРИСОВКА ПЕРСОНАЖЕЙ ============ */
function drawHero(x, y, isWalking, walkTimer) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));

  let animation = 'walk_down';
  let frameIndex = 0;

  // Приоритет: стартовое пробуждение -> смерть -> действия -> ходьба
  if (!isAwake) {
    if (heroAction === 'wake_up') {
      animation = 'wake_up';
      const elapsed = heroActionDuration('wake_up') - heroActionTimer;
      frameIndex = Math.min(2, Math.floor(elapsed * 4));
    } else if (heroAction === 'stand_up') {
      animation = 'stand_up';
      const elapsed = heroActionDuration('stand_up') - heroActionTimer;
      frameIndex = Math.min(1, Math.floor(elapsed * 4));
    } else {
      // Лежит
      animation = 'dead';
      frameIndex = 0;
    }
  } else if (heroDead && (!heroAction || heroActionTimer <= 0)) {
    animation = 'dead';
    frameIndex = (heroAnimations.dead || []).length - 1;
  } else if (heroAction && heroActionTimer > 0) {
    animation = heroAction;
    const elapsed = Math.max(0, (heroActionDuration(animation) - heroActionTimer));
    frameIndex = Math.min((heroAnimations[animation] || []).length - 1, Math.floor(elapsed * 8));
  } else if (isWalking) {
    animation = `walk_${heroFacing}`;
    frameIndex = Math.floor(walkTimer * 1.5) % 4;
  } else {
    animation = `walk_${heroFacing}`;
    frameIndex = 0;
  }

  const frames = heroAnimations[animation] || [];
  const sprite = frames[frameIndex] || frames[0];

  if (sprite && sprite.complete && sprite.naturalWidth > 0) {
    // Масштабируем спрайт, чтобы он был нормального размера в мире
    const maxW = 100;
    const maxH = 120;
    const scale = Math.min(maxW / sprite.naturalWidth, maxH / sprite.naturalHeight);
    const w = sprite.naturalWidth * scale;
    const h = sprite.naturalHeight * scale;
    
    ctx.imageSmoothingEnabled = false;
    
    // Если стоим/идём влево, спрайты в папке уже нарисованы правильно, 
    // поэтому мы НЕ используем ctx.scale(-1, 1). 
    // Отрисовываем как есть.
    ctx.drawImage(sprite, -w / 2, -h, w, h);
  } else {
    // Заглушка
    ctx.fillStyle = '#3a2a2a';
    ctx.beginPath(); ctx.arc(0, -20, 20, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawCharon(x, y) {
  if (imagesLoaded && imgCharon.complete && !charonSprite) charonSprite = processImage(imgCharon);
  ctx.save(); ctx.translate(x, y);
  if (charonSprite) {
    const w = 130, h = 150;
    ctx.shadowColor = 'rgba(180, 180, 180, 0.35)'; ctx.shadowBlur = 18;
    ctx.drawImage(charonSprite, -w / 2, -h, w, h);
  }
  ctx.restore();
}

function drawTreeAsset(tx, ty, scale = 1, seed = 0) {
  if (imagesLoaded && imgTree.complete && !treeSprite) treeSprite = processImage(imgTree);
  if (treeSprite) {
    const w = treeSprite.width * scale;
    const h = treeSprite.height * scale;
    ctx.save(); ctx.translate(tx, ty);
    const sway = Math.sin(Date.now() * 0.001 + seed) * 0.01;
    ctx.rotate(sway);
    ctx.drawImage(treeSprite, -w / 2, -h, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = '#0d120c';
    ctx.beginPath(); ctx.moveTo(tx, ty - 100 * scale); ctx.lineTo(tx + 30 * scale, ty); ctx.lineTo(tx - 30 * scale, ty); ctx.fill();
  }
}

/* ============ ОТРИСОВКА МИРА ============ */
function drawWorld() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, gameCanvas.height);
  skyGrad.addColorStop(0, '#04060a'); skyGrad.addColorStop(0.4, '#0a1018'); 
  skyGrad.addColorStop(0.7, '#141a22'); skyGrad.addColorStop(1, '#1a2028');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

  const starParallax = cameraX * 0.1;
  stars.forEach(star => {
    const sx = (star.x - starParallax) % WORLD.outside.width;
    if (sx < -50 || sx > gameCanvas.width + 50) return;
    const alpha = star.baseAlpha + Math.sin(Date.now() * 0.001 * star.twinkleSpeed + star.phase) * 0.3;
    ctx.fillStyle = `rgba(200, 210, 230, ${Math.max(0.1, Math.min(1, alpha))})`;
    ctx.fillRect(sx, star.y, star.size, star.size);
  });

  ctx.save();
  ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

  if (currentZone === 'outside') {
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, WORLD.outside.minY, WORLD.outside.width, WORLD.outside.height);
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.moveTo(300, 1950); ctx.quadraticCurveTo(1600, 1500, 2900, 1200);
    ctx.quadraticCurveTo(3400, 1100, 3700, 900); ctx.lineTo(3800, 980);
    ctx.quadraticCurveTo(3450, 1180, 2950, 1290); ctx.quadraticCurveTo(1650, 1600, 420, 1980); ctx.fill();

    ctx.fillStyle = '#2c2c2c';
    ctx.beginPath(); ctx.moveTo(600, 1850); ctx.quadraticCurveTo(1800, 1400, 2600, 1250);
    ctx.quadraticCurveTo(3200, 1150, 3400, 1000); ctx.lineTo(3450, 1080);
    ctx.quadraticCurveTo(3250, 1250, 2650, 1350); ctx.quadraticCurveTo(1850, 1500, 700, 1900); ctx.fill();

    // КПП
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(2900, 700, 150, 250);
    ctx.fillStyle = '#141414'; ctx.fillRect(2880, 680, 190, 20); 
    ctx.fillStyle = '#5a5030'; ctx.fillRect(2930, 750, 90, 70); 
    ctx.fillStyle = '#141414'; ctx.fillRect(2910, 850, 50, 100); 
    ctx.fillStyle = '#444'; ctx.fillRect(2940, 900, 6, 6); 

    // Шлагбаум
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(3080, 780, 15, 170);
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#552222' : '#555';
      if (state.flags.barrierOpen) ctx.fillRect(3085, 780 - i * 15, 12, 15);
      else ctx.fillRect(3100 + i * 30, 820, 30, 12);
    }

    // Предметы
    if (!state.items.includes('keycard')) {
      ctx.fillStyle = '#4a7a5a'; ctx.fillRect(2400, 1000, 20, 12);
      ctx.shadowColor = '#4a7a5a'; ctx.shadowBlur = 10;
      ctx.strokeRect(2400, 1000, 20, 12); ctx.shadowBlur = 0;
    }
    if (!state.items.includes('note')) {
      ctx.fillStyle = '#c0c8c4'; ctx.fillRect(560, 1850, 15, 20);
      ctx.shadowColor = '#c0c8c4'; ctx.shadowBlur = 10;
      ctx.strokeRect(560, 1850, 15, 20); ctx.shadowBlur = 0;
    }

    trees.forEach(tree => { drawTreeAsset(tree.x, tree.y, tree.scale, tree.seed); });

    const fog = ctx.createLinearGradient(0, 900, 0, 1600);
    fog.addColorStop(0, 'rgba(60, 65, 70, 0)'); fog.addColorStop(1, 'rgba(60, 65, 70, 0.3)');
    ctx.fillStyle = fog; ctx.fillRect(cameraX, 900, gameCanvas.width, 700);

    drawCharon(3300, 850);
    drawHero(heroX, heroY, isWalking, walkTimer);
  } else {
    // Внутри КПП
    ctx.fillStyle = '#141414'; ctx.fillRect(0, 0, WORLD.inside.width, WORLD.inside.height);
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0, WORLD.inside.minY, WORLD.inside.width, WORLD.inside.height);
    
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(400, 480, 200, 40);
    ctx.fillStyle = '#141414'; ctx.fillRect(420, 520, 10, 80); ctx.fillRect(570, 520, 10, 80);
    
    ctx.save(); ctx.translate(500, 520);
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(-30, -80, 60, 80);
    ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.arc(0, -100, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#141414'; ctx.fillRect(-36, -140, 72, 30);
    ctx.restore();

    const lampLight = ctx.createRadialGradient(500, 400, 10, 500, 400, 300);
    lampLight.addColorStop(0, 'rgba(100, 90, 60, 0.2)'); lampLight.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lampLight; ctx.fillRect(0, 0, WORLD.inside.width, WORLD.inside.height);
    ctx.fillStyle = '#141414'; ctx.fillRect(0, 500, 40, 200);

    drawHero(heroX, heroY, isWalking, walkTimer);
  }
  ctx.restore();

  const vignette = ctx.createRadialGradient(
    gameCanvas.width/2, gameCanvas.height/2, 300,
    gameCanvas.width/2, gameCanvas.height/2, 900
  );
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
}

/* ============ ЛОГИКА И ЦИКЛ ============ */
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  let dx = 0, dy = 0;
  
  // Управление работает только если герой встал
  if (isAwake && !heroDead && !heroAction) {
    if (keys.a) { dx -= 1; heroDirection = -1; heroFacing = 'left'; }
    if (keys.d) { dx += 1; heroDirection = 1; heroFacing = 'right'; }
    if (keys.w) { dy -= 1; if (!dx) heroFacing = 'up'; }
    if (keys.s) { dy += 1; if (!dx) heroFacing = 'down'; }
  }

  if (heroActionTimer > 0) {
    heroActionTimer = Math.max(0, heroActionTimer - dt);
    if (heroActionTimer === 0) {
      if (heroAction === 'wake_up') {
        playHeroAction('stand_up', 0.65);
      } else if (heroAction === 'stand_up') {
        heroAction = null;
        isAwake = true;
        gameStarted = true;
        say("Ты поднимаешься на ноги. Лес вокруг кажется мёртвым. Где-то впереди виднеется тусклый свет КПП.");
      } else {
        heroAction = null;
      }
    }
  }

  if (dx !== 0 || dy !== 0) {
    const length = Math.sqrt(dx*dx + dy*dy);
    heroX += (dx/length) * heroSpeed * dt;
    heroY += (dy/length) * heroSpeed * dt;
    isWalking = true;
    walkTimer += dt * 12;
  } else {
    isWalking = false;
  }

  const zone = WORLD[currentZone];
  heroX = Math.max(50, Math.min(zone.width - 50, heroX));
  heroY = Math.max(zone.minY, Math.min(zone.maxY, heroY));

  const targetCamX = heroX - gameCanvas.width / 2;
  const targetCamY = heroY - gameCanvas.height / 2;
  cameraX += (targetCamX - cameraX) * Math.min(1, dt * 5);
  cameraY += (targetCamY - cameraY) * Math.min(1, dt * 5);
  cameraX = Math.max(0, Math.min(zone.width - gameCanvas.width, cameraX));
  cameraY = Math.max(0, Math.min(zone.height - gameCanvas.height + 200, cameraY));

  if (state.hero) { state.hero.x = heroX; state.hero.y = heroY; }

  drawWorld();
  requestAnimationFrame(tick);
}

/* ============ ВВОД ============ */
// Пробуждение по клику или клавише
function triggerWakeUp() {
  if (!isAwake && heroAction !== 'wake_up' && heroAction !== 'stand_up') {
    document.getElementById('textPanel').classList.remove('show');
    playHeroAction('wake_up', 0.9);
  }
}

window.addEventListener('keydown', (e) => {
  if (!gameStarted) triggerWakeUp();

  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц') keys.w = true;
  if (k === 'a' || k === 'ф') keys.a = true;
  if (k === 's' || k === 'ы') keys.s = true;
  if (k === 'd' || k === 'в') keys.d = true;
  if (k === 'c' || k === 'с') keys.c = true;
  
  if (k === ' ' && !e.repeat) { e.preventDefault(); playHeroAction('jump', 0.65); }
  if (k === 'j' && !e.repeat) playHeroAction('attack', 0.42);
  // Тестовые кнопки
  if (k === 'k' && !e.repeat) playHeroAction('knocked_out', 0.8);
  if (k === 'u' && !e.repeat) playHeroAction('wake_up', 0.9);
  if (k === 'i' && !e.repeat) playHeroAction('stand_up', 0.65);
  if (k === 'r' && !e.repeat) playHeroAction('dead', 1.2);
});

window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц') keys.w = false;
  if (k === 'a' || k === 'ф') keys.a = false;
  if (k === 's' || k === 'ы') keys.s = false;
  if (k === 'd' || k === 'в') keys.d = false;
  if (k === 'c' || k === 'с') keys.c = false;
});

gameCanvas.addEventListener('click', (e) => {
  if (!gameStarted) { triggerWakeUp(); return; }

  const rect = gameCanvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (gameCanvas.width / rect.width) + cameraX;
  const clickY = (e.clientY - rect.top) * (gameCanvas.height / rect.height) + cameraY;

  if (currentZone === 'outside') {
    if (clickX >= 2910 && clickX <= 2960 && clickY >= 850 && clickY <= 950) { enterBooth(); return; }
    if (clickX >= 2930 && clickX <= 3020 && clickY >= 750 && clickY <= 820) { interact('horace_outside'); return; }
    if (clickX >= 3220 && clickX <= 3380 && clickY >= 650 && clickY <= 850) { interact('charon'); return; }
    if (!state.items.includes('keycard') && clickX >= 2400 && clickX <= 2420 && clickY >= 1000 && clickY <= 1012) { interact('keycard'); return; }
    if (!state.items.includes('note') && clickX >= 560 && clickX <= 575 && clickY >= 1850 && clickY <= 1870) { interact('note'); return; }
    if (clickX >= 3080 && clickX <= 3300 && clickY >= 780 && clickY <= 830) { interact('barrier'); return; }
  } else {
    if (clickX >= 0 && clickX <= 50 && clickY >= 500 && clickY <= 700) { exitBooth(); return; }
    if (clickX >= 440 && clickX <= 560 && clickY >= 380 && clickY <= 550) { interact('horace_inside'); return; }
  }
});

/* ============ ПЕРЕХОДЫ И ВЗАИМОДЕЙСТВИЕ ============ */
function enterBooth() {
  const fade = document.getElementById('fadeOverlay');
  fade.classList.add('active');
  setTimeout(() => {
    currentZone = 'inside';
    heroX = 200; heroY = 650;
    document.getElementById('locName').innerText = 'Внутри КПП';
    document.getElementById('locGoal').innerText = 'Поговорить с Горацием';
    fade.classList.remove('active');
    say("Внутри будки темно. Единственный свет — от настольной лампы. Гораций сидит за столом.");
  }, 800);
}

function exitBooth() {
  const fade = document.getElementById('fadeOverlay');
  fade.classList.add('active');
  setTimeout(() => {
    currentZone = 'outside';
    heroX = 2910; heroY = 980;
    document.getElementById('locName').innerText = 'Пролог';
    document.getElementById('locGoal').innerText = 'Сумрачный лес';
    fade.classList.remove('active');
  }, 800);
}

function interact(id) {
  const obj = gameObjects[id];
  if (!obj) return;
  if (obj.onClick) { obj.onClick(); return; }
  if (typeof obj.text === 'function') { say(obj.text()); return; }
  say(obj.text);
}

const gameObjects = {
  horace_outside: {
    onClick: () => say("Гораций смотрит на тебя через мутное стекло и стучит пальцем по вывеске: «Зайди».", "Гораций")
  },
  horace_inside: {
    onClick: () => {
      if (state.flags.barrierOpen) { say("— Проходи, — говорит Гораций.", "Гораций"); return; }
      if (state.items.includes('note') && !state.flags.horaceTalked) {
        state.flags.horaceTalked = true; save();
        say("«О, ты нашёл мой пропуск? — Гораций облегчённо выдыхает. — А то я уже обыскался. Давай сюда». Он ставит печать. Шлагбаум поднимается.", "Гораций");
        state.flags.barrierOpen = true; save();
        return;
      }
      if (state.flags.horaceTalked) { say("— Пропуск нужен. Ищи в самом низу тропинки.", "Гораций"); return; }
      state.flags.horaceTalked = true; save();
      say("«Ещё один. Пропуск есть?» Ты мотаешь головой. «Я свой потерял. Обронил где-то внизу, на тропинке. Найдёшь — подниму шлагбаум».", "Гораций");
    }
  },
  charon: {
    onClick: () => {
      if (!state.flags.charonTalked) {
        state.flags.charonTalked = true; save();
        say("«Ещё одна заблудшая душа. Привет. Я — Харон. Шлагбаум закрыт, Гораций потерял пропуск. Поищи внизу тропинки».", "Харон");
      } else {
        say("— Я жду внизу, у реки. Как найдёшь пропуск — приходи.", "Харон");
      }
    }
  },
  keycard: {
    onClick: () => {
      if (state.items.includes('keycard')) return;
      state.items.push('keycard'); playHeroAction('pickup_item', 0.65); save(); renderInventory();
      say("Ты подобрал ключ-карту. Она холодная. На обратной стороне: «Собственность КПП. Не терять».");
    }
  },
  note: {
    onClick: () => {
      if (state.items.includes('note')) return;
      state.items.push('note'); playHeroAction('pickup_item', 0.65); save(); renderInventory();
      say("Старая записка. «Что надеется на прощенье Божье...» — дальше не разобрать. С обратной стороны печать Горация. Это его пропуск!");
    }
  },
  barrier: {
    text: () => state.flags.barrierOpen ? "Шлагбаум поднят." : "Шлагбаум опущен. Нужен пропуск Горация."
  }
};

/* ============ ИНВЕНТАРЬ ============ */
const allItems = { 
  keycard: { icon: '🗝', title: 'Ключ-карта', desc: 'Собственность КПП.' },
  note: { icon: '📜', title: 'Записка', desc: '«Что надеется на прощенье Божье...» С печатью Горация.' }
};
function renderInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.items.forEach(id => {
    const item = allItems[id]; if (!item) return;
    const el = document.createElement('div');
    el.className = 'item-icon'; el.textContent = item.icon; el.title = item.title;
    el.addEventListener('click', () => { say(`Предмет: ${item.title}. ${item.desc}`); });
    inv.appendChild(el);
  });
}
</script>
