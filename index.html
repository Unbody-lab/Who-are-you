<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты — Пролог (Пиксель)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --brightness: 1; }
  body {
    background: #020202; color: #8a8a8a; font-family: 'VT323', monospace;
    overflow: hidden; height: 100vh; user-select: none;
    filter: brightness(var(--brightness)); transition: filter 0.3s;
  }

  /* ===== ОБНОВЛЁННЫЙ ГЛАВНЫЙ МЕЮ (с поддержкой фона) ===== */
  #mainMenu { 
    position: fixed; inset: 0; z-index: 400; 
    /* Сначала градиент затемнения, потом картинка. Если картинки нет, будет просто градиент и цвет #050202 */
    background: linear-gradient(rgba(5, 2, 2, 0.75), rgba(5, 2, 2, 0.9)), url('menu.jpg');
    background-size: cover;
    background-position: center;
    background-color: #050202;
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
  }
  #mainMenu h1 { font-size: 64px; color: #8a3030; margin-bottom: 50px; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(138,48,48,0.5); }
  .menu-btn { background: transparent; border: 2px solid #3a1010; color: #a08080;
    padding: 15px 40px; font-size: 32px; font-family: 'VT323', monospace;
    cursor: pointer; margin: 10px; width: 300px; transition: all 0.2s; }
  .menu-btn:hover { background: #3a1010; color: #fff; box-shadow: 0 0 15px #8a3030; }

  #chapterSelect { position: fixed; inset: 0; z-index: 350; background: #050202;
    display: none; flex-direction: column; align-items: center; padding: 40px; overflow-y: auto; }
  #chapterSelect h2 { font-size: 40px; color: #a08080; margin-bottom: 30px; flex-shrink: 0; }
  .circle-block { width: 100%; max-width: 1200px; margin-bottom: 30px; background: #110b0b;
    border: 2px solid #2a1515; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
  .circle-block.locked { opacity: 0.6; filter: grayscale(0.8); }
  .circle-title { font-size: 32px; color: #d08080; margin-bottom: 15px;
    border-bottom: 1px solid #3a1010; padding-bottom: 10px; }
  .locations-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .location-card { background: #1a1010; border: 2px solid #3a1010; width: 280px;
    border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s; }
  .location-card.active { cursor: pointer; }
  .location-card.active:hover { border-color: #8a3030; box-shadow: 0 0 15px rgba(138,48,48,0.5); transform: scale(1.02); }
  .location-card.locked { cursor: not-allowed; border-color: #222; }
  .loc-img { width: 100%; height: 140px; object-fit: cover; border-bottom: 2px solid #3a1010;
    background: #111; display: flex; align-items: center; justify-content: center; color: #444; font-size: 20px; }
  .location-card.active .loc-img { background: #1a1010; }
  .loc-info { padding: 15px; display: flex; flex-direction: column; gap: 5px; }
  .loc-title { font-size: 24px; color: #d08080; }
  .loc-desc { font-size: 18px; color: #a08080; font-style: italic; }
  .loc-status { font-size: 18px; color: #5a8080; margin-top: 5px; }

  #settings { position: fixed; inset: 0; z-index: 350; background: #050202;
    display: none; flex-direction: column; align-items: center; justify-content: center; }
  #settings h2 { font-size: 40px; color: #a08080; margin-bottom: 30px; }
  .setting-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; font-size: 24px; }
  input[type=range] { width: 300px; accent-color: #8a3030; }

  #cutscene { position: fixed; inset: 0; z-index: 300; background: #000;
    display: none; align-items: center; justify-content: center; transition: opacity 1.5s; }
  #cutscene.hidden { opacity: 0; pointer-events: none; }
  #csBg { position: absolute; inset: 0; transition: background 1.2s, background-image 1s ease-in-out; 
    background-size: cover; background-position: center; background: #0a0a0a; }
  #csText { position: absolute; bottom: 0; left: 0; right: 0; min-height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 40%);
    padding: 50px 80px; font-size: 32px; line-height: 1.4; color: #a0a0a0;
    display: flex; align-items: flex-end; z-index: 2; }
  #csText span { max-width: 900px; }
  #csNext { position: absolute; bottom: 30px; right: 60px; color: #5a2020; font-size: 24px;
    font-style: italic; cursor: pointer; z-index: 3; animation: blink 1.8s infinite; }
  @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  #game { position: fixed; inset: 0; opacity: 1; transition: opacity 1.5s;
    overflow: hidden; display: none; align-items: center; justify-content: center; background: #000; }
  #game.hidden { opacity: 0; pointer-events: none; }
  #gameCanvas { display: block; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges; }
  #uiOverlay { position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
  #topBar { display: flex; justify-content: space-between; background: rgba(10,5,5,0.85);
    border: 2px solid #3a1010; border-radius: 8px; padding: 10px 20px; color: #a08080; font-size: 22px; pointer-events: auto; }
  #textPanel { pointer-events: none; min-height: 80px; background: rgba(5,2,2,0.9);
    border: 2px solid #4a1515; padding: 20px 30px; font-size: 28px; line-height: 1.3;
    color: #b0a0a0; margin-top: auto; max-width: 800px; align-self: center; width: 100%;
    border-radius: 6px; transition: opacity 0.5s; opacity: 0; }
  #textPanel.show { opacity: 1; }
  #textPanel .speaker { color: #8a3030; font-style: italic; }
  #hint { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    color: #c0a060; font-size: 24px; text-shadow: 0 0 8px #000; opacity: 0; transition: opacity 0.3s; }
  #hint.show { opacity: 1; }
  #inventory { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column;
    gap: 8px; pointer-events: auto; }
  .item-icon { width: 48px; height: 48px; background: #1a1010; border: 2px solid #4a2020;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; transition: all 0.2s; }
  .item-icon:hover { border-color: #8a3030; box-shadow: 0 0 12px rgba(138,48,48,0.5); }
  #fadeOverlay { position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity 0.8s; z-index: 200; }
  #fadeOverlay.active { opacity: 1; }

  /* ===== НОВЫЕ ЭЛЕМЕНТЫ UI ===== */
  #questLog {
    position: fixed; right: 20px; top: 80px; z-index: 100;
    background: rgba(10,5,5,0.9); border: 2px solid #3a1010; border-radius: 8px;
    padding: 15px; width: 280px; display: none; pointer-events: auto;
  }
  #questLog h3 { color: #d08080; font-size: 24px; margin-bottom: 10px; border-bottom: 1px solid #3a1010; padding-bottom: 5px; }
  #questList { list-style: none; padding: 0; margin: 0; font-size: 20px; color: #a08080; line-height: 1.4; }
  
  #interactionIcons { position: absolute; inset: 0; pointer-events: none; z-index: 200; }
  .world-icon {
    position: absolute; transform: translate(-50%, -100%); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; pointer-events: auto;
  }
  .icon-bubble {
    width: 44px; height: 44px; background: rgba(10, 5, 5, 0.9); border: 2px solid #8a3030;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 0 12px rgba(138, 48, 48, 0.8);
    animation: bounce 1.5s infinite ease-in-out;
  }
  .icon-bubble img { width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; }
  .icon-label {
    background: rgba(0,0,0,0.85); color: #c0a060; font-size: 18px; padding: 3px 10px;
    border-radius: 4px; margin-top: 6px; white-space: nowrap; border: 1px solid #3a1010;
  }
  @keyframes bounce { 0%, 100% { transform: translate(-50%, -100%) translateY(0); } 50% { transform: translate(-50%, -100%) translateY(-8px); } }

  #actionMenu {
    position: fixed; z-index: 1000; background: rgba(10, 5, 5, 0.95);
    border: 2px solid #4a2020; border-radius: 8px; padding: 15px;
    display: none; flex-direction: column; align-items: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.9); pointer-events: auto;
  }
  #actionMenuTitle { color: #d08080; font-size: 24px; margin-bottom: 12px; border-bottom: 1px solid #3a1010; padding-bottom: 5px; width: 100%; text-align: center; }
  #actionMenuButtons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  #itemModal {
    position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; pointer-events: auto;
  }
  #itemModalContent {
    background: #1a1010; border: 2px solid #4a2020; padding: 30px; max-width: 500px; width: 90%;
    color: #c0a0a0; font-size: 24px; line-height: 1.5; white-space: pre-wrap;
    text-align: center; box-shadow: 0 0 30px #000; border-radius: 8px;
  }
  #itemModalTitle { color: #d08080; margin-bottom: 15px; font-size: 28px; }

  #assetReport {
    position: fixed; left: 12px; top: 12px; z-index: 500; display: none;
    background: rgba(10,2,2,0.92); border: 2px solid #6a2020; border-radius: 6px;
    padding: 12px 16px; font-size: 18px; line-height: 1.35; color: #d0a0a0;
    max-width: 520px; pointer-events: auto; white-space: pre-wrap;
  }
  #assetReport b { color: #ff8080; }
</style>
</head>
<body>

<div id="assetReport"></div>

<div id="mainMenu">
  <h1>КТО ТЫ</h1>
  <button class="menu-btn" id="btnPlay">Играть</button>
  <button class="menu-btn" id="btnSettings">Настройки</button>
</div>

<div id="chapterSelect">
  <h2>Выбор главы</h2>
  <div id="chaptersContainer"></div>
  <button class="menu-btn" style="width:200px; margin-bottom: 30px;" id="btnBackFromChapters">Назад</button>
</div>

<div id="settings">
  <h2>Настройки</h2>
  <div class="setting-row">
    <span>Яркость:</span>
    <input type="range" id="brightnessSlider" min="0.3" max="1.5" step="0.1" value="1">
  </div>
  <button class="menu-btn" style="width:200px; margin-top:30px;" id="btnBackFromSettings">Назад</button>
</div>

<div id="cutscene">
  <div id="csBg"></div>
  <div id="csText"><span id="csTextContent"></span></div>
  <div id="csNext">нажми, чтобы продолжить →</div>
</div>

<div id="game">
  <canvas id="gameCanvas"></canvas>
  <div id="uiOverlay">
    <div id="topBar">
      <div id="locName">Пролог</div>
      <div id="locGoal">Сумрачный лес</div>
    </div>
    <div id="inventory"></div>
    <div id="heroControls" style="position:absolute;left:20px;bottom:20px;color:#806060;font-size:18px;background:rgba(5,2,2,.65);padding:8px 12px;border:1px solid #3a1010;border-radius:4px;pointer-events:auto;">WASD — движение · Space — прыжок · J — атака · C — присесть · Q — задания</div>
    <div id="hint"></div>
    <div id="textPanel"><span id="textContent"></span></div>
  </div>
  
  <div id="questLog">
    <h3>Задания</h3>
    <ul id="questList"></ul>
  </div>
  
  <div id="interactionIcons"></div>
  
  <div id="actionMenu">
    <div id="actionMenuTitle"></div>
    <div id="actionMenuButtons"></div>
  </div>

  <div id="itemModal">
    <div id="itemModalContent">
      <div id="itemModalTitle"></div>
      <div id="itemModalText"></div>
      <button class="menu-btn" style="width:150px;margin-top:20px;font-size:24px;" id="closeItemModalBtn">Закрыть</button>
    </div>
  </div>

  <div id="fadeOverlay"></div>
</div>

<audio id="bgmIntro" src="intro.mp3" loop></audio>
<audio id="bgmForest" src="forest_ambient.mp3" loop></audio>

<script>
/* ==========================================================================
   ИНСТРУКЦИЯ ПО ДОБАВЛЕНИЮ ВАШИХ КАРТИНОК:
   Положите эти файлы в ту же папку, где лежит этот HTML-файл 
   (или в подпапку assets/, код найдёт их автоматически):

   1. menu_bg.png (или .jpg) — Фоновая картинка для ГЛАВНОГО МЕНЮ.
   2. intro_1.png ... intro_9.png — 9 картинок для ИНТРО-КАТЦЕНЫ.
   3. icon_inspect.png — Иконка для кнопки "Осмотреть" (глаз, лупа и т.д.).
   4. icon_pickup.png  — Иконка для кнопки "Подобрать" (рука и т.д.).
   
   Если каких-то файлов не будет, игра НЕ сломается: 
   она покажет красивые градиенты и эмодзи (👁️ / ✋) в качестве замены.
   ========================================================================== */

/* ============ АУДИО И НАСТРОЙКИ ============ */
const audioIntro = document.getElementById('bgmIntro');
const audioForest = document.getElementById('bgmForest');
audioIntro.volume = 0.6; audioForest.volume = 0.4;

let isAudioStarted = false;
function playIntroMusic() {
  if (isAudioStarted) return;
  isAudioStarted = true;
  audioIntro.play().catch(e => console.log("Аудио заблокировано"));
}
function playForestMusic() {
  if (!audioIntro.paused) audioIntro.pause();
  audioForest.currentTime = 0;
  audioForest.play().catch(e => console.log("Ошибка аудио"));
}

const slider = document.getElementById('brightnessSlider');
slider.addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--brightness', e.target.value);
});

/* ============ НАВИГАЦИЯ МЕНЮ ============ */
document.getElementById('btnPlay').addEventListener('click', () => {
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('chapterSelect').style.display = 'flex';
  renderChapters();
});
document.getElementById('btnSettings').addEventListener('click', showSettings);
document.getElementById('btnBackFromChapters').addEventListener('click', hideChapters);
document.getElementById('btnBackFromSettings').addEventListener('click', hideSettings);

function hideChapters() {
  document.getElementById('chapterSelect').style.display = 'none';
  document.getElementById('mainMenu').style.display = 'flex';
}
function showSettings() {
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('settings').style.display = 'flex';
}
function hideSettings() {
  document.getElementById('settings').style.display = 'none';
  document.getElementById('mainMenu').style.display = 'flex';
}

/* ============ СПИСОК ГЛАВ ============ */
const chaptersData = [
  { title: 'Пролог', locked: false, locations: [
    { title: 'Сумрачный лес', desc: 'Вы очутились в странном лесу, вы ничего не помните из прошлой жизни, ни имени, ни кем вы были, всё что вам остаётся это идти вперёд в надежде, что впереди что-то есть...', available: true, img: 'Prologue_Forest.jpg' },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '1 Круг · Лимб', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '2 Круг · Похоть', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '3 Круг · Чревоугодие', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '4 Круг · Жадность', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '5 Круг · Гнев', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '6 Круг · Ересь', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '7 Круг · Насилие', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '8 Круг · Обман', locked: true, locations: [
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]},
  { title: '9 Круг · Предательство', locked: true, locations: [
    { title: '???', desc: 'Замороженное озеро.', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null },
    { title: '???', desc: 'В разработке', available: false, img: null }
  ]}
];

function renderChapters() {
  const container = document.getElementById('chaptersContainer');
  container.innerHTML = '';
  chaptersData.forEach(circle => {
    const block = document.createElement('div');
    block.className = 'circle-block' + (circle.locked ? ' locked' : '');
    const title = document.createElement('div');
    title.className = 'circle-title';
    title.textContent = circle.title;
    block.appendChild(title);
    const row = document.createElement('div');
    row.className = 'locations-row';
    circle.locations.forEach(loc => {
      const card = document.createElement('div');
      card.className = 'location-card ' + (loc.available ? 'active' : 'locked');
      const imgDiv = document.createElement('div');
      imgDiv.className = 'loc-img';
      if (loc.img) {
        const img = document.createElement('img');
        img.src = loc.img;
        img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
        img.onerror = () => { img.style.display = 'none'; imgDiv.textContent = 'Нет изображения'; };
        imgDiv.appendChild(img);
      } else imgDiv.textContent = '???';
      const infoDiv = document.createElement('div');
      infoDiv.className = 'loc-info';
      const locTitle = document.createElement('div');
      locTitle.className = 'loc-title'; locTitle.textContent = loc.title;
      const locDesc = document.createElement('div');
      locDesc.className = 'loc-desc'; locDesc.textContent = loc.desc;
      const locStatus = document.createElement('div');
      locStatus.className = 'loc-status';
      locStatus.textContent = loc.available ? 'Доступно' : 'В разработке';
      infoDiv.appendChild(locTitle); infoDiv.appendChild(locDesc); infoDiv.appendChild(locStatus);
      card.appendChild(imgDiv); card.appendChild(infoDiv);
      if (loc.available) {
        card.addEventListener('click', () => {
          document.getElementById('chapterSelect').style.display = 'none';
          document.getElementById('cutscene').style.display = 'flex';
          playIntroMusic();
          showCutscene();
        });
      }
      row.appendChild(card);
    });
    block.appendChild(row);
    container.appendChild(block);
  });
}

/* ============ СОСТОЯНИЕ И ЗАДАНИЯ ============ */
const state = { seen: {}, items: [], flags: {}, cutsceneDone: false, hero: { x: 500, y: 1000 } };
const SAVE_KEY = 'kto_ty_pixel_dante_v6';
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch(e) {} }
}

const quests = [
  { id: 'q1', text: 'Осмотреться в лесу', done: false },
  { id: 'q2', text: 'Найти пропуск (Ключ-карту или Записку)', done: false },
  { id: 'q3', text: 'Поговорить с Горацием', done: false },
  { id: 'q4', text: 'Пройти через шлагбаум', done: false }
];

function addQuestProgress(qText) {
  const q = quests.find(x => x.text.includes(qText) || qText.includes(x.text));
  if (q && !q.done) {
    q.done = true;
    renderQuests();
    say(`Задание выполнено: ${q.text}`);
  }
}

function renderQuests() {
  const list = document.getElementById('questList');
  list.innerHTML = '';
  quests.forEach(q => {
    const li = document.createElement('li');
    li.textContent = (q.done ? '✅ ' : '⬜ ') + q.text;
    li.style.color = q.done ? '#5a805a' : '#a08080';
    list.appendChild(li);
  });
}

/* ============ ТЕКСТ ============ */
let typeTimer = null, hidePanelTimer = null;
function say(text, speaker) {
  const panel = document.getElementById('textPanel');
  const el = document.getElementById('textContent');
  const prefix = speaker ? `<span class="speaker">${speaker}:</span> ` : '';
  el.innerHTML = ''; let i = 0;
  clearInterval(typeTimer); clearTimeout(hidePanelTimer);
  panel.classList.add('show');
  typeTimer = setInterval(() => {
    if (i >= text.length) {
      clearInterval(typeTimer);
      hidePanelTimer = setTimeout(() => { panel.classList.remove('show'); }, 7000);
      return;
    }
    el.innerHTML = prefix + text.slice(0, i + 1); i++;
  }, 25);
}
function typeInto(el, text, speed = 40, cb) {
  clearInterval(typeTimer); el.innerHTML = ''; let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); if (cb) cb(); return; }
    el.innerHTML = text.slice(0, i + 1); i++;
  }, speed);
}

const assetReport = [];
function logAsset(label, ok, tried, used) {
  assetReport.push({ label, ok, tried, used });
  if (!ok) console.warn('[ASSETS] НЕ НАЙДЕН:', label, 'пробовал:', tried.join(' | '));
  else console.log('[ASSETS] OK:', label, '←', used);
}

function loadImageWithFallbacks(label, srcList) {
  const img = new Image();
  img._ok = false;
  img._tried = [];
  let idx = 0;
  function tryNext() {
    if (idx >= srcList.length) {
      logAsset(label, false, img._tried, null);
      return;
    }
    const src = srcList[idx++];
    img._tried.push(src);
    img.onload = () => { img._ok = true; logAsset(label, true, img._tried, src); };
    img.onerror = () => { img.onload = null; tryNext(); };
    img.src = src;
  }
  tryNext();
  return img;
}

function prepSprite(img) {
  if (!img) return null;
  if (img._prepped !== undefined) return img._prepped;
  if (!img.complete || !img.naturalWidth) return null;
  try {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0, 0, c.width, c.height);
    const px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      if (px[i] > 230 && px[i+1] > 230 && px[i+2] > 230) px[i+3] = 0;
    }
    cx.putImageData(d, 0, 0);
    img._prepped = c;
  } catch (e) {
    img._prepped = img;
  }
  return img._prepped;
}

const heroAnimations = {};
const heroFrameCounts = { idle: 3, pickup_item_left: 2, pickup_item_right: 2,

let framesOk = 0, framesTotal = 0;

const HERO_W = 96, HERO_H = 126;
const SIDE_FRAMES_FACE_LEFT = true;

let heroAction = null, heroActionTimer = 0;
let heroDead = false, heroLying = false, introActive = false;

function heroActionDuration(name) {
  return ({ jump: 0.65, attack: 0.42, pickup_item: 0.65, knocked_out: 0.8,
    wake_up: 1.4, stand_up: 0.65, dead: 1.2, crouch: 0.3 })[name] || 0.7;
}
function playHeroAction(name, duration = 0.7) {
  if (heroDead && name !== 'wake_up' && name !== 'stand_up') return;
  heroAction = name;
  heroActionTimer = duration;
  if (name === 'dead') heroDead = true;
  if (name === 'wake_up') { heroDead = false; heroLying = false; }
}

function getIdleFallback() {
  for (const a of ['stand_up', 'walk_down', 'walk_left', 'walk_right']) {
    const f = heroAnimations[a] && heroAnimations[a][0];
    if (f && f._ok && f.complete && f.naturalWidth > 0) return { img: f, front: (a === 'walk_down') };
  }
  return null;
}

function drawSpriteInBox(src, w, h, anchorBottom) {
  const s = prepSprite(src);
  if (!s) return false;
  const sw = s.width || s.naturalWidth;
  const sh = s.height || s.naturalHeight;
  if (!sw || !sh) return false;
  const scale = Math.min(w / sw, h / sh);
  const dw = sw * scale, dh = sh * scale;
  ctx.drawImage(s, -dw / 2, anchorBottom ? -dh : -dh / 2, dw, dh);
  return true;
}

function drawHero(x, y) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.imageSmoothingEnabled = false;

  let animation, frameIndex = 0;

  if (heroLying) {
    animation = 'dead'; frameIndex = 0;
  } else if (heroDead && (!heroAction || heroActionTimer <= 0)) {
    animation = 'dead';
    frameIndex = Math.max(0, (heroAnimations.dead || []).length - 1);
  } else if (heroAction && heroActionTimer > 0) {
    animation = heroAction === 'pickup_item' ? `pickup_item_${heroFacing}` : heroAction;
    const frames = heroAnimations[animation] || [];
    const dur = heroActionDuration(animation);
    const elapsed = Math.max(0, dur - heroActionTimer);
    frameIndex = Math.min(frames.length - 1, Math.floor((elapsed / dur) * frames.length));
  } else if (keys.c && !heroDead) {
    animation = `crouch_${heroFacing}`;
    frameIndex = Math.floor(Date.now() / 260) % 2;
  } else if (isWalking) {
    animation = `walk_${heroFacing}`;
    frameIndex = Math.floor(walkTimer * 1.5) % 4;
  } else {
    animation = 'idle';
  }

  if (heroAction === 'jump' && heroActionTimer > 0) {
    const dur = heroActionDuration('jump');
    const p = 1 - heroActionTimer / dur;
    ctx.translate(0, -Math.sin(Math.PI * p) * 26);
  }

  const flip = (dir) => {
    if (SIDE_FRAMES_FACE_LEFT && dir === 1) ctx.scale(-1, 1);
    if (!SIDE_FRAMES_FACE_LEFT && dir === -1) ctx.scale(-1, 1);
  };

  if (animation === 'idle') {
    const idleLoop = [0, 1, 2, 1];
    const idleIndex = idleLoop[Math.floor(Date.now() / 240) % idleLoop.length];
    const idleFrames = heroAnimations.idle || [];
    const idleSprite = idleFrames[idleIndex] || idleFrames[0];
    let drew = false;
    if (idleSprite && idleSprite._ok) {
      flip(-heroDirection);
      const breath = Math.sin(Date.now() * 0.0025) * 1.2;
      ctx.translate(0, breath);
      drew = drawSpriteInBox(idleSprite, HERO_W, HERO_H, true);
    }
    if (!drew) {
      const fb = getIdleFallback();
      if (fb) { if (!fb.front) flip(-heroDirection); drew = drawSpriteInBox(fb.img, HERO_W, HERO_H, true); }
    }
    if (!drew) { ctx.fillStyle = '#3a2a2a'; ctx.beginPath(); ctx.arc(0, -14, 14, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    return;
  }

  if (['jump', 'attack', 'pickup_item', 'knocked_out'].includes(animation)) {
    flip(heroFacing === 'left' ? 1 : -1);
  }

  const frames = heroAnimations[animation] || [];
  const sprite = frames[frameIndex] || frames[0];

  let drew = drawSpriteInBox(sprite, HERO_W, HERO_H, animation !== 'dead');
  if (!drew) {
    const fb = getIdleFallback();
    if (fb) drew = drawSpriteInBox(fb.img, HERO_W, HERO_H, true);
  }
  if (!drew) { ctx.fillStyle = '#3a2a2a'; ctx.beginPath(); ctx.arc(0, -14, 14, 0, Math.PI * 2); ctx.fill(); }

  ctx.restore();
}

function drawHorace(x, y, patrol = false) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.imageSmoothingEnabled = false;
  const t = Date.now();
  const frameIndex = patrol ? (Math.floor(t / 210) % 3) + 2 : [0,1,0,0,1,0][Math.floor(t / 320) % 6];
  const sprite = horaceFrames[frameIndex] || horaceFrames[0];
  ctx.shadowColor = 'rgba(35,255,90,0.28)';
  ctx.shadowBlur = 10 + Math.sin(t * 0.004) * 3;
  if (sprite && sprite._ok) drawSpriteInBox(sprite, 68, 94, true);
  ctx.restore();
}

function drawTreeAsset(tx, ty, scale = 1, seed = 0) {
  if (imgTree._ok) {
    const s = prepSprite(imgTree);
    if (s) {
      const w = s.width * scale, h = s.height * scale;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(Math.sin(Date.now() * 0.001 + seed) * 0.01);
      ctx.drawImage(s, -w / 2, -h, w, h);
      ctx.restore();
      return;
    }
  }
  ctx.fillStyle = '#0d120c';
  ctx.beginPath();
  ctx.moveTo(tx, ty - 100 * scale);
  ctx.lineTo(tx + 30 * scale, ty);
  ctx.lineTo(tx - 30 * scale, ty);
  ctx.fill();
}

/* ============ ОТРИСОВКА МИРА ============ */
function drawWorld() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, gameCanvas.height);
  skyGrad.addColorStop(0, '#04060a'); skyGrad.addColorStop(0.4, '#0a1018');
  skyGrad.addColorStop(0.7, '#141a22'); skyGrad.addColorStop(1, '#1a2028');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

  const starParallax = cameraX * 0.1;
  stars.forEach(star => {
    const sx = (star.x - starParallax) % WORLD.outside.width;
    if (sx < -50 || sx > gameCanvas.width + 50) return;
    const alpha = star.baseAlpha + Math.sin(Date.now() * 0.001 * star.twinkleSpeed + star.phase) * 0.3;
    ctx.fillStyle = `rgba(200,210,230,${Math.max(0.1, Math.min(1, alpha))})`;
    ctx.fillRect(sx, star.y, star.size, star.size);
  });

  ctx.save();
  ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

  if (currentZone === 'outside') {
    if (imgGrass._ok && imgGrass.complete && imgGrass.naturalWidth > 0) {
      const tileSize = 64;
      const startX = Math.floor(cameraX / tileSize) * tileSize;
      const startY = Math.floor(cameraY / tileSize) * tileSize;
      for (let x = startX; x < cameraX + gameCanvas.width + tileSize; x += tileSize) {
        for (let y = startY; y < cameraY + gameCanvas.height + tileSize; y += tileSize) {
          if (y > WORLD.outside.minY - 64) {
            ctx.drawImage(imgGrass, x, y, tileSize, tileSize);
          }
        }
      }
    } else {
      ctx.fillStyle = '#1e2e1e';
      ctx.fillRect(0, WORLD.outside.minY, WORLD.outside.width, WORLD.outside.height);
    }

    if (imgPath._ok && imgPath.complete && imgPath.naturalWidth > 0) {
      try {
        const pathPattern = ctx.createPattern(imgPath, 'repeat');
        ctx.fillStyle = pathPattern;
        ctx.beginPath();
        ctx.moveTo(300, 1950);
        ctx.quadraticCurveTo(1600, 1500, 2900, 1200);
        ctx.quadraticCurveTo(3400, 1100, 3700, 900);
        ctx.lineTo(3800, 980);
        ctx.quadraticCurveTo(3450, 1180, 2950, 1290);
        ctx.quadraticCurveTo(1650, 1600, 420, 1980);
        ctx.fill();
      } catch(e) {
        ctx.fillStyle = '#2a2a2a';
        ctx.beginPath();
        ctx.moveTo(300, 1950);
        ctx.quadraticCurveTo(1600, 1500, 2900, 1200);
        ctx.quadraticCurveTo(3400, 1100, 3700, 900);
        ctx.lineTo(3800, 980);
        ctx.quadraticCurveTo(3450, 1180, 2950, 1290);
        ctx.quadraticCurveTo(1650, 1600, 420, 1980);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.moveTo(300, 1950);
      ctx.quadraticCurveTo(1600, 1500, 2900, 1200);
      ctx.quadraticCurveTo(3400, 1100, 3700, 900);
      ctx.lineTo(3800, 980);
      ctx.quadraticCurveTo(3450, 1180, 2950, 1290);
      ctx.quadraticCurveTo(1650, 1600, 420, 1980);
      ctx.fill();
    }

    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(2900, 700, 150, 250);
    ctx.fillStyle = '#141414'; ctx.fillRect(2880, 680, 190, 20);
    ctx.fillStyle = '#5a5030'; ctx.fillRect(2930, 750, 90, 70);
    ctx.fillStyle = '#141414'; ctx.fillRect(2910, 850, 50, 100);
    ctx.fillStyle = '#444';    ctx.fillRect(2940, 900, 6, 6);

    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(3080, 780, 15, 170);
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#552222' : '#555';
      if (state.flags.barrierOpen) ctx.fillRect(3085, 780 - i * 15, 12, 15);
      else ctx.fillRect(3100 + i * 30, 820, 30, 12);
    }

    trees.forEach(tree => drawTreeAsset(tree.x, tree.y, tree.scale, tree.seed));

    const fog = ctx.createLinearGradient(0, 900, 0, 1600);
    fog.addColorStop(0, 'rgba(60,65,70,0)'); fog.addColorStop(1, 'rgba(60,65,70,0.3)');
    ctx.fillStyle = fog;
    ctx.fillRect(cameraX, 900, gameCanvas.width, 700);
    
    drawHero(heroX, heroY);
  } else {
    ctx.fillStyle = '#141414'; ctx.fillRect(0, 0, WORLD.inside.width, WORLD.inside.height);
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0, WORLD.inside.minY, WORLD.inside.width, WORLD.inside.height);
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(400, 480, 200, 40);
    ctx.fillStyle = '#141414'; ctx.fillRect(420, 520, 10, 80); ctx.fillRect(570, 520, 10, 80);
    ctx.save();
    ctx.translate(500, 520);
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(-30, -80, 60, 80);
    ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.arc(0, -100, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#141414'; ctx.fillRect(-36, -140, 72, 30);
    ctx.restore();
    const lampLight = ctx.createRadialGradient(500, 400, 10, 500, 400, 300);
    lampLight.addColorStop(0, 'rgba(100,90,60,0.2)'); lampLight.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lampLight; ctx.fillRect(0, 0, WORLD.inside.width, WORLD.inside.height);
    ctx.fillStyle = '#141414'; ctx.fillRect(0, 500, 40, 200);
    drawHorace(500, 610, false);
    drawHero(heroX, heroY);
  }

  ctx.restore();

  const vignette = ctx.createRadialGradient(
    gameCanvas.width / 2, gameCanvas.height / 2, 300,
    gameCanvas.width / 2, gameCanvas.height / 2, 900);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
}

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function createIcon(wx, wy, type, title, actions) {
  const sx = wx - cameraX;
  const sy = wy - cameraY;
  if (sx < -50 || sx > gameCanvas.width + 50 || sy < -50 || sy > gameCanvas.height + 50) return;
  
  const el = document.createElement('div');
  el.className = 'world-icon';
  el.style.left = sx + 'px';
  el.style.top = sy + 'px';
  
  let iconHtml = '';
  if (type === 'pickup' && imgIconPickup._ok) {
    iconHtml = `<img src="${imgIconPickup.src}" alt="Подобрать">`;
  } else if (type === 'inspect' && imgIconInspect._ok) {
    iconHtml = `<img src="${imgIconInspect.src}" alt="Осмотреть">`;
  } else {
    iconHtml = type === 'pickup' ? '✋' : '👁️';
  }
  
  el.innerHTML = `<div class="icon-bubble">${iconHtml}</div><div class="icon-label">${title}</div>`;
  
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    showActionMenu(title, actions, e.clientX, e.clientY);
  });
  
  document.getElementById('interactionIcons').appendChild(el);
}

function showActionMenu(title, actions, cx, cy) {
  const menu = document.getElementById('actionMenu');
  menu.style.display = 'flex';
  
  menu.style.left = cx + 'px';
  menu.style.top = (cy - 80) + 'px';
  
  document.getElementById('actionMenuTitle').textContent = title;
  const btns = document.getElementById('actionMenuButtons');
  btns.innerHTML = '';
  
  actions.forEach(act => {
    const btn = document.createElement('button');
    btn.className = 'menu-btn';
    btn.style.width = '160px';
    btn.style.fontSize = '22px';
    btn.style.padding = '10px';
    btn.style.margin = '5px';
    btn.textContent = act.label;
    btn.style.pointerEvents = 'auto';
    
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      act.action();
      menu.style.display = 'none';
    });
    btns.appendChild(btn);
  });
}

document.addEventListener('pointerdown', (e) => {
  const menu = document.getElementById('actionMenu');
  if (menu.style.display === 'flex' && !menu.contains(e.target)) {
    menu.style.display = 'none';
  }
});

function updateInteractionIcons() {
  const container = document.getElementById('interactionIcons');
  container.innerHTML = '';
  
  if (currentZone === 'outside') {
    if (dist(heroX, heroY, 1000, 1200) < 250) {
      createIcon(1000, 1200, 'inspect', 'Мрачный лес', [
        { label: 'Осмотреть', action: () => { say("Густой, мрачный лес. Деревья нависают, словно стражи. Воздух спёртый, пахнет прелой листвой."); addQuestProgress('Осмотреться в лесу'); } }
      ]);
    }
    if (dist(heroX, heroY, 2950, 850) < 250) {
      createIcon(2950, 850, 'inspect', 'КПП', [
        { label: 'Осмотреть', action: () => say("Маленькая будка с тусклым светом. Внутри виден силуэт дежурного.") },
        { label: 'Войти', action: enterBooth }
      ]);
    }
    if (dist(heroX, heroY, 3100, 820) < 250) {
      createIcon(3100, 820, 'inspect', 'Шлагбаум', [
        { label: 'Осмотреть', action: () => say(state.flags.barrierOpen ? "Шлагбаум поднят. Путь открыт." : "Шлагбаум опущен. Нужен пропуск.") },
        { label: state.flags.barrierOpen ? 'Пройти' : 'Открыть', action: () => {
            if (state.flags.barrierOpen) { say("Вы проходите дальше..."); }
            else if (state.items.includes('keycard') || state.items.includes('note')) {
              state.flags.barrierOpen = true; save();
              say("Вы прикладываете пропуск. Шлагбаум со скрипом поднимается.");
              addQuestProgress('Пройти через шлагбаум');
            } else {
              say("Нужен пропуск. Без него шлагбаум не открыть.");
            }
          }
        }
      ]);
    }
    if (!state.items.includes('keycard') && dist(heroX, heroY, 2400, 1000) < 150) {
      createIcon(2400, 1000, 'pickup', 'Ключ-карта', [
        { label: 'Осмотреть', action: () => say("Пластиковая карта с выцветшей надписью «КПП». Лежит в грязи.") },
        { label: 'Подобрать', action: () => {
            state.items.push('keycard'); save(); renderInventory();
            playHeroAction('pickup_item', heroActionDuration('pickup_item'));
            say("Вы подобрали ключ-карту.");
            addQuestProgress('Найти пропуск');
          }
        }
      ]);
    }
    if (!state.items.includes('note') && dist(heroX, heroY, 560, 1850) < 150) {
      createIcon(560, 1850, 'pickup', 'Записка', [
        { label: 'Осмотреть', action: () => say("Старая, помятая записка с печатью.") },
        { label: 'Подобрать', action: () => {
            state.items.push('note'); save(); renderInventory();
            playHeroAction('pickup_item', heroActionDuration('pickup_item'));
            say("Вы подобрали записку.");
            addQuestProgress('Найти пропуск');
          }
        }
      ]);
    }
  } else {
    if (dist(heroX, heroY, 200, 650) < 150) {
      createIcon(200, 650, 'inspect', 'Дверь', [
        { label: 'Выйти', action: exitBooth }
      ]);
    }
    if (dist(heroX, heroY, 500, 610) < 150) {
      createIcon(500, 610, 'inspect', 'Гораций', [
        { label: 'Осмотреть', action: () => say("Усталый смотритель в помятой форме.") },
        { label: 'Говорить', action: () => {
            if (state.flags.barrierOpen) { say("— Проходи, — бурчит Гораций.", "Гораций"); return; }
            if (state.items.includes('note') && !state.flags.horaceTalked) {
              state.flags.horaceTalked = true; save();
              say("«О, ты нашёл мой пропуск? — Гораций облегчённо выдыхает. — Давай сюда». Он ставит печать. Шлагбаум поднимается.", "Гораций");
              state.flags.barrierOpen = true; save();
              addQuestProgress('Поговорить с Горацием');
              return;
            }
            if (state.flags.horaceTalked) { say("— Пропуск нужен. Ищи внизу тропинки.", "Гораций"); return; }
            state.flags.horaceTalked = true; save();
            say("«Ещё один. Пропуск есть?» Ты мотаешь головой. «Я свой потерял. Обронил где-то внизу, на тропинке. Найдёшь — подниму шлагбаум».", "Гораций");
            addQuestProgress('Поговорить с Горацием');
          }
        }
      ]);
    }
  }
}

/* ============ ПЕРЕХОДЫ ============ */
function enterBooth() {
  const fade = document.getElementById('fadeOverlay');
  fade.classList.add('active');
  setTimeout(() => {
    currentZone = 'inside';
    heroX = 200; heroY = 650;
    document.getElementById('locName').innerText = 'Внутри КПП';
    document.getElementById('locGoal').innerText = 'Поговорить с Горацием';
    fade.classList.remove('active');
    say("Внутри будки темно. Единственный свет — от настольной лампы. Гораций сидит за столом.");
  }, 800);
}
function exitBooth() {
  const fade = document.getElementById('fadeOverlay');
  fade.classList.add('active');
  setTimeout(() => {
    currentZone = 'outside';
    heroX = 2910; heroY = 980;
    document.getElementById('locName').innerText = 'Пролог';
    document.getElementById('locGoal').innerText = 'Сумрачный лес';
    fade.classList.remove('active');
  }, 800);
}

/* ============ ИНВЕНТАРЬ ============ */
const allItems = {
  keycard: { icon: '🗝', title: 'Ключ-карта', desc: 'Собственность КПП. Потёртая пластиковая карта с магнитной полосой. На обратной стороне выгравировано: «Не терять».' },
  note:    { icon: '📜', title: 'Записка', desc: '«Что надеется на прощенье Божье...\nТот должен быть готов отдать всё.»\n\nС обратной стороны: печать Горация и пометка «Пропуск №44». Это и есть пропуск!' }
};

function renderInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.items.forEach(id => {
    const item = allItems[id]; if (!item) return;
    const el = document.createElement('div');
    el.className = 'item-icon'; el.textContent = item.icon; el.title = 'Нажмите, чтобы прочитать';
    el.addEventListener('click', () => {
      document.getElementById('itemModal').style.display = 'flex';
      document.getElementById('itemModalTitle').textContent = item.title;
      document.getElementById('itemModalText').textContent = item.desc;
    });
    inv.appendChild(el);
  });
}

document.getElementById('closeItemModalBtn').addEventListener('click', () => {
  document.getElementById('itemModal').style.display = 'none';
});

/* ============ ЦИКЛ ============ */
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  let dx = 0, dy = 0;
  const canMove = !introActive && !heroDead && (!heroAction || heroAction === 'jump');
  if (canMove) {
    if (keys.a) { dx -= 1; heroDirection = -1; heroFacing = 'left'; }
    if (keys.d) { dx += 1; heroDirection = 1;  heroFacing = 'right'; }
    if (keys.w) { dy -= 1; if (!dx) heroFacing = 'up'; }
    if (keys.s) { dy += 1; if (!dx) heroFacing = 'down'; }
  }

  if (heroActionTimer > 0) {
    heroActionTimer = Math.max(0, heroActionTimer - dt);
    if (heroActionTimer === 0) {
      if (heroAction === 'wake_up') playHeroAction('stand_up', heroActionDuration('stand_up'));
      else heroAction = null;
    }
  } else if (!heroDead) {
    heroAction = null;
  }

  if (dx !== 0 || dy !== 0) {
    const length = Math.sqrt(dx * dx + dy * dy);
    heroX += (dx / length) * heroSpeed * dt;
    heroY += (dy / length) * heroSpeed * dt;
    isWalking = true;
    walkTimer += dt * 12;
  } else {
    isWalking = false;
  }

  const zone = WORLD[currentZone];
  heroX = Math.max(50, Math.min(zone.width - 50, heroX));
  heroY = Math.max(zone.minY, Math.min(zone.maxY, heroY));

  const targetCamX = heroX - gameCanvas.width / 2;
  const targetCamY = heroY - gameCanvas.height / 2;
  cameraX += (targetCamX - cameraX) * Math.min(1, dt * 5);
  cameraY += (targetCamY - cameraY) * Math.min(1, dt * 5);
  cameraX = Math.max(0, Math.min(zone.width - gameCanvas.width, cameraX));
  cameraY = Math.max(0, Math.min(zone.height - gameCanvas.height + 200, cameraY));

  if (state.hero) { state.hero.x = heroX; state.hero.y = heroY; }

  updateInteractionIcons();
  drawWorld();
  requestAnimationFrame(tick);
}

/* ============ ВВОД ============ */
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц') keys.w = true;
  if (k === 'a' || k === 'ф') keys.a = true;
  if (k === 's' || k === 'ы') keys.s = true;
  if (k === 'd' || k === 'в') keys.d = true;
  if (k === 'c' || k === 'с') keys.c = true;

  if (k === 'q' || k === 'й' || e.key === 'Tab') {
    e.preventDefault();
    const ql = document.getElementById('questLog');
    ql.style.display = ql.style.display === 'none' ? 'block' : 'none';
  }

  if (introActive || heroDead) return;

  if (k === ' ' && !e.repeat) { e.preventDefault(); if (!heroAction) playHeroAction('jump', heroActionDuration('jump')); }
  if (k === 'j' && !e.repeat) playHeroAction('attack', heroActionDuration('attack'));
  if (k === 'k' && !e.repeat) playHeroAction('knocked_out', heroActionDuration('knocked_out'));
  if (k === 'u' && !e.repeat) playHeroAction('wake_up', heroActionDuration('wake_up'));
  if (k === 'i' && !e.repeat) playHeroAction('stand_up', heroActionDuration('stand_up'));
  if (k === 'r' && !e.repeat) playHeroAction('dead', heroActionDuration('dead'));
});

window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц') keys.w = false;
  if (k === 'a' || k === 'ф') keys.a = false;
  if (k === 's' || k === 'ы') keys.s = false;
  if (k === 'd' || k === 'в') keys.d = false;
  if (k === 'c' || k === 'с') keys.c = false;
});

/* ============ СТАРТ ИГРЫ ============ */
function initGame() {
  load();
  heroX = state.hero?.x ?? 500;
  heroY = state.hero?.y ?? 1000;

  gameCanvas.width = 1280;
  gameCanvas.height = 720;

  renderQuests();
  renderInventory();
  startWakeUpIntro();
  requestAnimationFrame(tick);

  setTimeout(showAssetReport, 2000);
}

function showAssetReport() {
  const missing = assetReport.filter(a => !a.ok);
  const framesMissing = framesTotal - framesOk;
  const el = document.getElementById('assetReport');

  if (missing.length === 0 && framesMissing === 0) {
    console.log(`[ASSETS] Всё загружено: кадров ${framesOk}/${framesTotal}`);
    return;
  }

  let html = `<b>⚠ Проблемы с ассетами</b>\n`;
  html += `Загружено кадров героя: <b>${framesOk}/${framesTotal}</b>\n`;
  if (location.protocol === 'file:') {
    html += `<b>Внимание:</b> страница открыта через file:// — браузер может блокировать загрузку. Запустите локальный сервер (Live Server в VS Code или python -m http.server).\n`;
  }
  html += `URL страницы: ${location.href}\n\n`;
  if (framesMissing > 0) html += `Не найдено кадров из assets/hero/ (проверьте точное имя папки и файлов, регистр букв!).\n`;
  missing.forEach(m => {
    html += `<b>${m.label}</b> — пробовал: ${m.tried.join('  →  ')}\n`;
  });
  el.innerHTML = html;
  el.style.display = 'block';
}
