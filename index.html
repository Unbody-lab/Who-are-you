<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты — Пролог (Пиксель)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020202; color: #8a8a8a; font-family: 'VT323', monospace;
    overflow: hidden; height: 100vh; user-select: none;
  }

  /* ===== КАТСЦЕНА ===== */
  #cutscene {
    position: fixed; inset: 0; z-index: 300; background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s;
  }
  #cutscene.hidden { opacity: 0; pointer-events: none; }
  #csBg { position: absolute; inset: 0; transition: background 1.2s; background: #0a0a0a; }
  #csText {
    position: absolute; bottom: 0; left: 0; right: 0; min-height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 40%);
    padding: 50px 80px; font-size: 32px; line-height: 1.4;
    color: #a0a0a0; display: flex; align-items: flex-end; z-index: 2;
  }
  #csText span { max-width: 900px; }
  #csNext {
    position: absolute; bottom: 30px; right: 60px; color: #5a2020; font-size: 24px;
    font-style: italic; cursor: pointer; z-index: 3; animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* ===== ИГРА ===== */
  #game {
    position: fixed; inset: 0; opacity: 1; transition: opacity 1.5s;
    overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000;
  }
  #game.hidden { opacity: 0; pointer-events: none; }

  #gameCanvas {
    display: block; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  #uiOverlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
  }

  #topBar {
    display: flex; justify-content: space-between;
    background: rgba(10, 5, 5, 0.85); border: 2px solid #3a1010; border-radius: 8px;
    padding: 10px 20px; color: #a08080; font-size: 22px;
  }

  #textPanel {
    pointer-events: none; min-height: 80px; background: rgba(5,2,2,0.9);
    border: 2px solid #4a1515; padding: 20px 30px; font-size: 28px; line-height: 1.3;
    color: #b0a0a0; margin-top: auto; max-width: 800px; align-self: center; width: 100%;
    border-radius: 6px; transition: opacity 0.5s; opacity: 0;
  }
  #textPanel.show { opacity: 1; }
  #textPanel .speaker { color: #8a3030; font-style: italic; }

  #inventory { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  .item-icon {
    width: 48px; height: 48px; background: #1a1010; border: 2px solid #4a2020;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; transition: all 0.2s;
  }
  .item-icon:hover { border-color: #8a3030; box-shadow: 0 0 12px rgba(138,48,48,0.5); }

  #fadeOverlay {
    position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity 0.8s; z-index: 200;
  }
  #fadeOverlay.active { opacity: 1; }
</style>
</head>
<body>

<div id="cutscene">
  <div id="csBg"></div>
  <div id="csText"><span id="csTextContent"></span></div>
  <div id="csNext">нажми, чтобы продолжить →</div>
</div>

<div id="game" class="hidden">
  <canvas id="gameCanvas"></canvas>
  
  <div id="uiOverlay">
    <div id="topBar">
      <div id="locName">Круг 1 · Лимб</div>
      <div id="locGoal">Сумрачный лес</div>
    </div>
    
    <div id="inventory"></div>
    <div id="textPanel"><span id="textContent"></span></div>
  </div>
  <div id="fadeOverlay"></div>
</div>

<script>
/* ============ СОСТОЯНИЕ ============ */
const state = {
  seen: {}, items: [], flags: {}, cutsceneDone: false,
  hero: { x: 500, y: 800 }
};
const SAVE_KEY = 'kto_ty_pixel_dante';
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch(e) {} }
}

/* ============ ТЕКСТ ============ */
let typeTimer = null;
let hidePanelTimer = null;

function say(text, speaker) {
  const panel = document.getElementById('textPanel');
  const el = document.getElementById('textContent');
  const prefix = speaker ? `<span class="speaker">${speaker}:</span> ` : '';
  
  el.innerHTML = ''; let i = 0;
  clearInterval(typeTimer);
  clearTimeout(hidePanelTimer);
  panel.classList.add('show');

  typeTimer = setInterval(() => {
    if (i >= text.length) { 
      clearInterval(typeTimer); 
      hidePanelTimer = setTimeout(() => { panel.classList.remove('show'); }, 7000);
      return; 
    }
    el.innerHTML = prefix + text.slice(0, i + 1); i++;
  }, 25);
}

function typeInto(el, text, speed = 40, cb) {
  clearInterval(typeTimer); el.innerHTML = ''; let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); if (cb) cb(); return; }
    el.innerHTML = text.slice(0, i + 1); i++;
  }, speed);
}

/* ============ КАТСЦЕНА ============ */
const cutscene = [
  { bg: 'radial-gradient(circle at 50% 40%, #1a1010 0%, #000 70%)', text: 'Ты не помнишь своего имени. Никто здесь его не помнит. Имени больше нет — есть только «ты».' },
  { bg: 'radial-gradient(circle at 50% 30%, #2a1010 0%, #000 70%)', text: 'Ты жил. Как все: дышал, забывал, обещал. Кому-то — важное. Кому-то — пустое.' },
  { bg: 'radial-gradient(circle at 50% 50%, #3a0505 0%, #000 70%)', text: 'А потом — тишина. Не тьма, не свет. Просто тишина, в которой ты перестал быть.' },
  { bg: 'radial-gradient(circle at 50% 60%, #2a0505 0%, #000 70%)', text: 'И вот ты здесь. Внизу. Там, где начинается всё, что ты откладывал.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a0a0a 0%, #000 70%)', text: 'Сумрачный лес. КПП. Начало.' },
];
let csIndex = 0;
const csBg = document.getElementById('csBg');
const csTextContent = document.getElementById('csTextContent');
const csNext = document.getElementById('csNext');

function showCutscene() {
  document.getElementById('cutscene').classList.remove('hidden');
  document.getElementById('game').classList.add('hidden');
  csIndex = 0; renderCsSlide();
}
function renderCsSlide() {
  const slide = cutscene[csIndex];
  csBg.style.background = slide.bg;
  csNext.style.display = 'none';
  typeInto(csTextContent, slide.text, 40, () => { csNext.style.display = 'block'; });
}
csNext.addEventListener('click', () => {
  if (csIndex < cutscene.length - 1) { csIndex++; renderCsSlide(); }
  else {
    document.getElementById('cutscene').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    state.cutsceneDone = true; save();
    initGame();
  }
});

/* ============ ИГРА / CANVAS ============ */
const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');

let currentZone = 'outside'; 

const WORLD = {
  outside: { width: 4000, height: 1400, minY: 620, maxY: 1350 },
  inside: { width: 1200, height: 800, minY: 500, maxY: 750 }
};

let heroX = 500;
let heroY = 800; 
let heroSpeed = 180; 
let isWalking = false;
let heroDirection = 1;
let walkTimer = 0;

let cameraX = 0;
let cameraY = 0;
let lastTime = performance.now();
const keys = { w: false, a: false, s: false, d: false };

/* ============ СПРАЙТЫ ============ */
const imgHero = new Image();
const imgCharon = new Image();
imgHero.src = 'hero.png'; 
imgCharon.src = 'charon.png';

let imagesLoaded = false;
let loadCount = 0;

function processImage(img) {
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = img.width;
  tempCanvas.height = img.height;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(img, 0, 0);
  const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
  const data = imgData.data;
  for (let y = 0; y < tempCanvas.height; y++) {
    for (let x = 0; x < tempCanvas.width; x++) {
      const i = (y * tempCanvas.width + x) * 4;
      if (data[i] > 200 && data[i+1] > 200 && data[i+2] > 200) {
        if (x < 20 || x > tempCanvas.width - 20 || y < 20 || y > tempCanvas.height - 20) {
          data[i+3] = 0; 
        }
      }
    }
  }
  tempCtx.putImageData(imgData, 0, 0);
  return tempCanvas;
}

function checkLoaded() { loadCount++; if (loadCount >= 2) imagesLoaded = true; }
imgHero.onload = checkLoaded; imgCharon.onload = checkLoaded;
imgHero.onerror = () => { console.error('Нет hero.png'); checkLoaded(); };
imgCharon.onerror = () => { console.error('Нет charon.png'); checkLoaded(); };

let heroSprite = null;
let charonSprite = null;

function initGame() {
  load();
  heroX = state.hero?.x ?? 500;
  heroY = state.hero?.y ?? 800;
  
  gameCanvas.width = 1280; 
  gameCanvas.height = 720;
  
  renderInventory();
  say("Тьма сгущается. Деревья здесь мёртвые, а воздух пахнет пеплом. Впереди — КПП, единственный островок неясного света.");
  requestAnimationFrame(tick);
}

/* ============ ОТРИСОВКА ПЕРСОНАЖЕЙ ============ */
function drawHero(x, y, isWalking, direction, walkTimer) {
  if (imagesLoaded && imgHero.complete && !heroSprite) heroSprite = processImage(imgHero);

  ctx.save();
  ctx.translate(x, y);
  
  let tilt = isWalking ? Math.sin(walkTimer) * 0.15 : 0;
  let bounce = isWalking ? Math.abs(Math.sin(walkTimer * 2)) * 3 : 0; 
  ctx.rotate(tilt * direction);
  ctx.translate(0, -bounce);

  if (direction < 0) ctx.scale(-1, 1);

  if (heroSprite) {
    const w = 160; 
    const h = 180; 
    // Красные глаза в темноте начинают светиться
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 15;
    ctx.drawImage(heroSprite, -w / 2, -h, w, h);
  } else {
    ctx.fillStyle = '#ff2222'; ctx.beginPath(); ctx.arc(0, -20, 20, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawCharon(x, y) {
  if (imagesLoaded && imgCharon.complete && !charonSprite) charonSprite = processImage(imgCharon);

  ctx.save();
  ctx.translate(x, y);
  
  if (charonSprite) {
    const w = 160; 
    const h = 200;
    // Лёгкое свечение вокруг Харона (как призрачный свет)
    ctx.shadowColor = 'rgba(200, 200, 200, 0.4)';
    ctx.shadowBlur = 25;
    ctx.drawImage(charonSprite, -w / 2, -h, w, h);
  } else {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, -20, 20, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
 
/* ============ ОТРИСОВКА МИРА (МРАК) ============ */
function drawWorld() {
  // Мёртвое небо
  const skyGrad = ctx.createLinearGradient(0, 0, 0, gameCanvas.height);
  skyGrad.addColorStop(0, '#000000'); 
  skyGrad.addColorStop(0.5, '#0a0202'); 
  skyGrad.addColorStop(1, '#0a0202');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

  ctx.save();
  ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

  if (currentZone === 'outside') {
    // Мёртвый лес (чёрные силуэты)
    for (let i = 0; i < 50; i++) {
      const tx = i * 80 + Math.sin(i) * 30;
      ctx.fillStyle = '#050202'; // Почти чёрный
      ctx.fillRect(tx, 200, 20, WORLD.outside.minY - 200); 
      // Кривые ветки
      ctx.beginPath(); 
      ctx.moveTo(tx+10, 200); 
      ctx.lineTo(tx+40, 250); 
      ctx.lineTo(tx-20, 300); 
      ctx.fill();
      ctx.beginPath(); ctx.arc(tx + 10, 200, 40, 0, Math.PI * 2); ctx.fill();
    }

    // Земля (пепел и грязь)
    ctx.fillStyle = '#050202';
    ctx.fillRect(0, WORLD.outside.minY, WORLD.outside.width, WORLD.outside.height);
    
    // Кровавые/ржавые пятна на земле
    ctx.fillStyle = '#1a0505';
    ctx.beginPath();
    ctx.moveTo(200, 1400);
    ctx.quadraticCurveTo(800, 900, 1300, 900);
    ctx.quadraticCurveTo(1600, 900, 1800, 700);
    ctx.lineTo(1800, 800);
    ctx.quadraticCurveTo(1600, 1000, 1300, 1000);
    ctx.quadraticCurveTo(800, 1000, 300, 1400);
    ctx.fill();

    // Будка КПП (тёмный силуэт)
    ctx.fillStyle = '#0a0505';
    ctx.fillRect(1300, 550, 150, 250);
    ctx.fillStyle = '#000';
    ctx.fillRect(1280, 530, 190, 20); // Крыша
    ctx.fillStyle = '#2a1515'; // Тусклый свет в окне
    ctx.fillRect(1330, 600, 90, 70); 
    ctx.fillStyle = '#000';
    ctx.fillRect(1310, 700, 50, 100); // Дверь
    // Ручка двери
    ctx.fillStyle = '#333';
    ctx.fillRect(1340, 750, 6, 6);

    // Шлагбаум
    ctx.fillStyle = '#111';
    ctx.fillRect(1480, 630, 15, 170);
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#3a0505' : '#555';
      if (state.flags.barrierOpen) {
        ctx.fillRect(1485, 630 - i * 15, 12, 15);
      } else {
        ctx.fillRect(1500 + i * 30, 670, 30, 12);
      }
    }

    // Ключ-карта
    if (!state.items.includes('keycard')) {
      ctx.fillStyle = '#6aba7a';
      ctx.fillRect(1000, 850, 20, 12);
      // Свечение карты
      ctx.shadowColor = '#6aba7a'; ctx.shadowBlur = 10;
      ctx.strokeRect(1000, 850, 20, 12);
      ctx.shadowBlur = 0;
    }
    
    // Записка
    if (!state.items.includes('note')) {
      ctx.fillStyle = '#d0d8d4';
      ctx.fillRect(1500, 1100, 15, 20);
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
      ctx.strokeRect(1500, 1100, 15, 20);
      ctx.shadowBlur = 0;
    }

    // Второй слой тумана поверх земли (Canvas gradient)
    const fog = ctx.createLinearGradient(0, 600, 0, 1100);
    fog.addColorStop(0, 'rgba(20, 10, 10, 0)');
    fog.addColorStop(1, 'rgba(20, 10, 10, 0.4)');
    ctx.fillStyle = fog;
    ctx.fillRect(cameraX, 600, gameCanvas.width, 500);

    drawCharon(1700, 700);
    drawHero(heroX, heroY, isWalking, heroDirection, walkTimer);
    
  } else {
    // ---- ВНУТРИ КПП ----
    ctx.fillStyle = '#0a0505';
    ctx.fillRect(0, 0, WORLD.inside.width, WORLD.inside.height);
    
    ctx.fillStyle = '#111';
    ctx.fillRect(0, WORLD.inside.minY, WORLD.inside.width, WORLD.inside.height);
    
    // Стол
    ctx.fillStyle = '#2a1515';
    ctx.fillRect(400, 480, 200, 40);
    ctx.fillStyle = '#050202';
    ctx.fillRect(420, 520, 10, 80);
    ctx.fillRect(570, 520, 10, 80);
    
    // Гораций за столом
    ctx.save();
    ctx.translate(500, 520);
    ctx.fillStyle = '#111'; 
    ctx.fillRect(-30, -80, 60, 80);
    ctx.fillStyle = '#2a1515'; // Лицо в тени
    ctx.beginPath(); ctx.arc(0, -100, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(-36, -140, 72, 30);
    ctx.restore();

    // Свет от лампы над столом
    const lampLight = ctx.createRadialGradient(500, 400, 10, 500, 400, 300);
    lampLight.addColorStop(0, 'rgba(100, 50, 50, 0.2)');
    lampLight.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lampLight;
    ctx.fillRect(0, 0, WORLD.inside.width, WORLD.inside.height);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 500, 40, 200);

    drawHero(heroX, heroY, isWalking, heroDirection, walkTimer);
  }

  ctx.restore();
  
  // ГЛОБАЛЬНАЯ ВИНЬЕТКА (Тьма по краям экрана)
  const vignette = ctx.createRadialGradient(
    gameCanvas.width/2, gameCanvas.height/2, 200,
    gameCanvas.width/2, gameCanvas.height/2, 800
  );
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.95)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
}

/* ============ ЛОГИКА И ЦИКЛ ============ */
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  let dx = 0; let dy = 0;
  if (keys.a) { dx -= 1; heroDirection = -1; }
  if (keys.d) { dx += 1; heroDirection = 1; }
  if (keys.w) { dy -= 1; }
  if (keys.s) { dy += 1; }

  if (dx !== 0 || dy !== 0) {
    const length = Math.sqrt(dx*dx + dy*dy);
    heroX += (dx/length) * heroSpeed * dt;
    heroY += (dy/length) * heroSpeed * dt;
    isWalking = true;
    walkTimer += dt * 12;
  } else {
    isWalking = false;
  }

  const zone = WORLD[currentZone];
  heroX = Math.max(50, Math.min(zone.width - 50, heroX));
  heroY = Math.max(zone.minY, Math.min(zone.maxY, heroY));

  const targetCamX = heroX - gameCanvas.width / 2;
  const targetCamY = heroY - gameCanvas.height / 2;
  
  cameraX += (targetCamX - cameraX) * Math.min(1, dt * 5);
  cameraY += (targetCamY - cameraY) * Math.min(1, dt * 5);
  
  cameraX = Math.max(0, Math.min(zone.width - gameCanvas.width, cameraX));
  cameraY = Math.max(0, Math.min(zone.height - gameCanvas.height + 200, cameraY));

  if (state.hero) { state.hero.x = heroX; state.hero.y = heroY; }

  drawWorld();
  requestAnimationFrame(tick);
}

/* ============ ВВОД ============ */
window.addEventListener('keydown', (e) => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = true;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = true;
  if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = true;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = false;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = false;
  if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = false;
});

gameCanvas.addEventListener('click', (e) => {
  const rect = gameCanvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (gameCanvas.width / rect.width) + cameraX;
  const clickY = (e.clientY - rect.top) * (gameCanvas.height / rect.height) + cameraY;

  if (currentZone === 'outside') {
    if (clickX >= 1310 && clickX <= 1360 && clickY >= 700 && clickY <= 800) {
      enterBooth(); return;
    }
    if (clickX >= 1330 && clickX <= 1420 && clickY >= 600 && clickY <= 670) {
      interact('horace_outside'); return;
    }
    if (clickX >= 1620 && clickX <= 1780 && clickY >= 500 && clickY <= 700) {
      interact('charon'); return;
    }
    if (!state.items.includes('keycard') && clickX >= 1000 && clickX <= 1020 && clickY >= 850 && clickY <= 862) {
      interact('keycard'); return;
    }
    if (!state.items.includes('note') && clickX >= 1500 && clickX <= 1515 && clickY >= 1100 && clickY <= 1120) {
      interact('note'); return;
    }
    if (clickX >= 1480 && clickX <= 1700 && clickY >= 630 && clickY <= 680) {
      interact('barrier'); return;
    }
  } else {
    if (clickX >= 0 && clickX <= 50 && clickY >= 500 && clickY <= 700) {
      exitBooth(); return;
    }
    if (clickX >= 440 && clickX <= 560 && clickY >= 380 && clickY <= 550) {
      interact('horace_inside'); return;
    }
  }
});

/* ============ ПЕРЕХОДЫ И ВЗАИМОДЕЙСТВИЕ ============ */
function enterBooth() {
  const fade = document.getElementById('fadeOverlay');
  fade.classList.add('active');
  setTimeout(() => {
    currentZone = 'inside';
    heroX = 200; heroY = 650;
    document.getElementById('locName').innerText = 'Внутри КПП';
    document.getElementById('locGoal').innerText = 'Поговорить с Горацием';
    fade.classList.remove('active');
    say("Внутри будки темно. Единственный свет — от настольной лампы. Гораций сидит за столом.");
  }, 800);
}

function exitBooth() {
  const fade = document.getElementById('fadeOverlay');
  fade.classList.add('active');
  setTimeout(() => {
    currentZone = 'outside';
    heroX = 1310; heroY = 830;
    document.getElementById('locName').innerText = 'Круг 1 · Лимб';
    fade.classList.remove('active');
  }, 800);
}

function interact(id) {
  const obj = gameObjects[id];
  if (!obj) return;
  if (obj.onClick) { obj.onClick(); return; }
  say(obj.text);
}

const gameObjects = {
  horace_outside: {
    onClick: () => say("Гораций смотрит на тебя через мутное стекло и стучит пальцем по вывеске: «Зайди».", "Гораций")
  },
  horace_inside: {
    onClick: () => {
      if (state.flags.barrierOpen) { say("— Проходи, — говорит Гораций.", "Гораций"); return; }
      
      if (state.items.includes('note') && !state.flags.horaceTalked) {
        state.flags.horaceTalked = true; save();
        say("«О, ты нашёл мой пропуск? — Гораций облегчённо выдыхает. — А то я уже обыскался. Давай сюда». Он ставит печать. Шлагбаум поднимается.", "Гораций");
        state.flags.barrierOpen = true; save();
        return;
      }
      
      if (state.flags.horaceTalked) { say("— Пропуск нужен. Ищи на тропинке.", "Гораций"); return; }
      state.flags.horaceTalked = true; save();
      say("«Ещё один. Пропуск есть?» Ты мотаешь головой. «Я свой потерял. Обронил где-то на тропинке. Найдёшь — подниму шлагбаум».", "Гораций");
    }
  },
  charon: {
    onClick: () => {
      if (!state.flags.charonTalked) {
        state.flags.charonTalked = true; save();
        say("«Ещё одна заблудшая душа. Привет. Я — Харон. Шлагбаум закрыт, Гораций потерял пропуск. Поищи на тропинке».", "Харон");
      } else {
        say("— Я жду внизу, у реки. Как найдёшь пропуск — приходи.", "Харон");
      }
    }
  },
  keycard: {
    onClick: () => {
      if (state.items.includes('keycard')) return;
      state.items.push('keycard'); save(); renderInventory();
      say("Ты подобрал ключ-карту. Она холодная. На обратной стороне: «Собственность КПП. Не терять».");
    }
  },
  note: {
    onClick: () => {
      if (state.items.includes('note')) return;
      state.items.push('note'); save(); renderInventory();
      say("Старая записка. «Что надеется на прощенье Божье...» — дальше не разобрать. С обратной стороны печать Горация. Это его пропуск!");
    }
  },
  barrier: {
    text: () => state.flags.barrierOpen ? "Шлагбаум поднят." : "Шлагбаум опущен. Нужен пропуск Горация."
  }
};

/* ============ ИНВЕНТАРЬ ============ */
const allItems = { 
  keycard: { icon: '🗝', title: 'Ключ-карта', desc: 'Собственность КПП.' },
  note: { icon: '📜', title: 'Записка', desc: '«Что надеется на прощенье Божье...» С печатью Горация.' }
};
function renderInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.items.forEach(id => {
    const item = allItems[id]; if (!item) return;
    const el = document.createElement('div');
    el.className = 'item-icon'; el.textContent = item.icon; el.title = item.title;
    el.addEventListener('click', () => {
      say(`Предмет: ${item.title}. ${item.desc}`);
    });
    inv.appendChild(el);
  });
}

/* ============ СТАРТ ============ */
load();
if (state.cutsceneDone) {
  document.getElementById('cutscene').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  initGame();
} else {
  showCutscene();
}
</script>

</body>
</html>
