<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты — Пролог (Пиксель)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070a; color: #c8ccd4; font-family: 'VT323', monospace;
    overflow: hidden; height: 100vh; user-select: none;
  }

  /* ===== КАТСЦЕНА ===== */
  #cutscene {
    position: fixed; inset: 0; z-index: 300; background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s;
  }
  #cutscene.hidden { opacity: 0; pointer-events: none; }
  #csBg { position: absolute; inset: 0; transition: background 1.2s; background: #0a0a0a; }
  #csText {
    position: absolute; bottom: 0; left: 0; right: 0; min-height: 200px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.92) 35%);
    padding: 50px 80px; font-size: 32px; line-height: 1.4;
    color: #d8dce4; display: flex; align-items: flex-end; z-index: 2;
  }
  #csText span { max-width: 900px; }
  #csNext {
    position: absolute; bottom: 30px; right: 60px; color: #6b7f9e; font-size: 24px;
    font-style: italic; cursor: pointer; z-index: 3; animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* ===== ИГРА ===== */
  #game {
    position: fixed; inset: 0; opacity: 1; transition: opacity 1.5s;
    overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000;
  }
  #game.hidden { opacity: 0; pointer-events: none; }

  canvas {
    display: block; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #0a1218;
  }

  #uiOverlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
  }

  #textPanel {
    pointer-events: auto; min-height: 100px; background: rgba(5,7,10,0.85);
    border: 2px solid #2a3548; padding: 20px 30px; font-size: 28px; line-height: 1.3;
    color: #b8bec8; margin-top: auto; max-width: 1000px; align-self: center; width: 100%;
  }
  #textPanel .speaker { color: #5a7a6a; font-style: italic; }

  #inventory { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  .item-icon {
    width: 48px; height: 48px; background: #1a2333; border: 2px solid #2a3548;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; transition: all 0.2s;
  }
  .item-icon:hover { border-color: #5a7a6a; box-shadow: 0 0 12px rgba(90,122,106,0.5); }

  #locTitle {
    position: absolute; top: 20px; left: 20px; font-size: 20px; letter-spacing: 2px;
    text-transform: uppercase; color: #4a5568;
  }
  #controls {
    position: absolute; top: 50px; left: 20px; font-size: 18px; color: #3a4558; line-height: 1.5;
  }
  #controls b { color: #5a7a6a; }

  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 40px;
  }
  #modal.open { display: flex; }
  #modalContent {
    background: #12181f; border: 2px solid #2a3548; padding: 40px;
    max-width: 600px; font-size: 26px; line-height: 1.4; color: #d0d4da; position: relative;
  }
  #modalClose { position: absolute; top: 12px; right: 16px; cursor: pointer; color: #6b7f9e; font-size: 32px; }
</style>
</head>
<body>

<div id="cutscene">
  <div id="csBg"></div>
  <div id="csText"><span id="csTextContent"></span></div>
  <div id="csNext">нажми, чтобы продолжить →</div>
</div>

<div id="game" class="hidden">
  <canvas id="gameCanvas"></canvas>
  
  <div id="uiOverlay">
    <div>
      <div id="locTitle">Пролог · Сумрачный лес — КПП</div>
      <div id="controls"><b>ПКМ</b> — идти · <b>ЛКМ по объекту</b> — подойти и осмотреть</div>
    </div>
    <div id="inventory"></div>
    <div id="textPanel"><span id="textContent"></span></div>
  </div>

  <div id="modal">
    <div id="modalContent">
      <div id="modalClose">×</div>
      <div id="modalText"></div>
    </div>
  </div>
</div>

<script>
/* ============ СОСТОЯНИЕ ============ */
const state = {
  seen: {}, items: [], flags: {}, cutsceneDone: false, hero: { x: 200 },
};
const SAVE_KEY = 'kto_ty_pixel_v2';
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch(e) {} }
}

/* ============ ТЕКСТ ============ */
let typeTimer = null;
function say(text, speaker) {
  const el = document.getElementById('textContent');
  const prefix = speaker ? `<span class="speaker">${speaker}:</span> ` : '';
  el.innerHTML = ''; let i = 0;
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); return; }
    el.innerHTML = prefix + text.slice(0, i + 1); i++;
  }, 25);
}
function typeInto(el, text, speed = 40, cb) {
  clearInterval(typeTimer); el.innerHTML = ''; let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(typeTimer); if (cb) cb(); return; }
    el.innerHTML = text.slice(0, i + 1); i++;
  }, speed);
}

/* ============ КАТСЦЕНА ============ */
const cutscene = [
  { bg: 'radial-gradient(circle at 50% 40%, #1a1410 0%, #050302 70%)', text: 'Ты не помнишь своего имени. Никто здесь его не помнит. Имени больше нет — есть только «ты».' },
  { bg: 'radial-gradient(circle at 50% 30%, #2a1a10 0%, #0a0604 70%)', text: 'Ты жил. Как все: дышал, забывал, обещал. Кому-то — важное. Кому-то — пустое.' },
  { bg: 'radial-gradient(circle at 50% 50%, #3a0a0a 0%, #0a0202 70%)', text: 'А потом — тишина. Не тьма, не свет. Просто тишина, в которой ты перестал быть.' },
  { bg: 'radial-gradient(circle at 50% 60%, #2a0a0a 0%, #050202 70%)', text: 'И вот ты здесь. Внизу. Там, где начинается всё, что ты откладывал.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a1a10 0%, #020604 70%)', text: 'Ты помнишь только её. Не лицо, не имя. Только тепло. И что-то в груди говорит: иди.' },
  { bg: 'radial-gradient(circle at 50% 50%, #0a1a10 0%, #020604 70%)', text: 'Сумрачный лес. КПП. Начало.' },
];
let csIndex = 0;
const csBg = document.getElementById('csBg');
const csTextContent = document.getElementById('csTextContent');
const csNext = document.getElementById('csNext');

function showCutscene() {
  document.getElementById('cutscene').classList.remove('hidden');
  document.getElementById('game').classList.add('hidden');
  csIndex = 0; renderCsSlide();
}
function renderCsSlide() {
  const slide = cutscene[csIndex];
  csBg.style.background = slide.bg;
  csNext.style.display = 'none';
  typeInto(csTextContent, slide.text, 40, () => { csNext.style.display = 'block'; });
}
csNext.addEventListener('click', () => {
  if (csIndex < cutscene.length - 1) { csIndex++; renderCsSlide(); }
  else {
    document.getElementById('cutscene').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    state.cutsceneDone = true; save();
    initGame();
  }
});

/* ============ ИГРА / CANVAS ============ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const SCENE_WIDTH = 1600;
const FLOOR_Y = 260;

let heroX = 200;
let targetX = null;
let heroDirection = 1;
let walkTimer = 0;
let isWalking = false;
let cameraX = 0;
let pendingClick = null;
let lastTime = performance.now();

// ЗАГРУЗКА КАРТИНОК (Твои спрайты)
const imgHero = new Image();
imgHero.src = 'hero.png'; // Имя твоего файла с героем
const imgCharon = new Image();
imgCharon.src = 'charon.png'; // Имя твоего файла с Хароном

// Флаг: если картинки не загрузятся (нет файлов), мы нарисуем заглушки
let imagesLoaded = false;
let loadCount = 0;
function checkLoaded() {
  loadCount++;
  if (loadCount >= 2) imagesLoaded = true;
}
imgHero.onload = checkLoaded;
imgHero.onerror = checkLoaded;
imgCharon.onload = checkLoaded;
imgCharon.onerror = checkLoaded;

function initGame() {
  load();
  heroX = state.hero?.x ?? 200;
  cameraX = heroX - canvas.width / 2;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  renderInventory();
  say("Сумрачный лес. Деревья стоят так плотно, что не видно неба. Перед тобой — КПП и шлагбаум. За ним — дорога вниз.");
  requestAnimationFrame(tick);
}

function resizeCanvas() {
  canvas.width = 480; canvas.height = 270;
}

/* ============ ОТРИСОВКА СПРАЙТОВ ============ */
function drawHero(x, y, isWalking, direction, walkTimer) {
  ctx.save();
  ctx.translate(x, y);

  let tilt = 0;
  let bounce = 0;
  if (isWalking) {
    tilt = Math.sin(walkTimer) * 0.15; 
    bounce = Math.abs(Math.sin(walkTimer * 2)) * 2; 
  }
  
  ctx.rotate(tilt * direction);
  ctx.translate(0, -bounce);

  if (direction < 0) ctx.scale(-1, 1);

  if (imagesLoaded && imgHero.complete && imgHero.naturalWidth > 0) {
    ctx.save();
    ctx.filter = 'multiply'; 
    
    // --- ИСПРАВЛЕНИЕ ПРОПОРЦИЙ ---
    // Задаем желаемую высоту персонажа на экране (например, 45 пикселей)
    const targetHeight = 45; 
    // Вычисляем ширину пропорционально
    const aspect = imgHero.naturalWidth / imgHero.naturalHeight;
    const targetWidth = targetHeight * aspect;

    // Рисуем: по центру X, и так, чтобы ноги были на земле (по оси Y)
    ctx.drawImage(imgHero, -targetWidth / 2, -targetHeight, targetWidth, targetHeight);
    // -----------------------------
    
    ctx.restore();
  } else {
    // Заглушка
    ctx.fillStyle = '#1a2230';
    ctx.fillRect(-8, -32, 16, 32);
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(-6, -28, 4, 4);
    ctx.fillRect(2, -28, 4, 4);
  }
  ctx.restore();
}

function drawCharon(x, y, isWalking, walkTimer) {
  ctx.save();
  ctx.translate(x, y);

  let tilt = Math.sin(walkTimer * 0.5) * 0.05;
  ctx.rotate(tilt);

  if (imagesLoaded && imgCharon.complete && imgCharon.naturalWidth > 0) {
    ctx.save();
    ctx.filter = 'multiply';
    
    // --- ИСПРАВЛЕНИЕ ПРОПОРЦИЙ ---
    // Харон чуть выше героя, ставим высоту 55 пикселей
    const targetHeight = 55;
    const aspect = imgCharon.naturalWidth / imgCharon.naturalHeight;
    const targetWidth = targetHeight * aspect;

    ctx.drawImage(imgCharon, -targetWidth / 2, -targetHeight, targetWidth, targetHeight);
    // -----------------------------
    
    ctx.restore();
  } else {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(-10, -40, 20, 40);
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(-8, -30, 16, 10);
  }
  ctx.restore();
}

function drawCharon(x, y, isWalking, walkTimer) {
  ctx.save();
  ctx.translate(x, y);

  // Харон стоит, но немного покачивается
  let tilt = Math.sin(walkTimer * 0.5) * 0.05;
  ctx.rotate(tilt);

  const spriteW = 40;
  const spriteH = 60;

  if (imagesLoaded && imgCharon.complete && imgCharon.naturalWidth > 0) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(imgCharon, -spriteW / 2, -spriteH, spriteW, spriteH);
  } else {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(-10, -40, 20, 40);
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(-8, -30, 16, 10); // борода
  }
  ctx.restore();
}

/* ============ ОТРИСОВКА МИРА ============ */
function drawWorld() {
  ctx.fillStyle = '#0a1218';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // Небо
  const skyGrad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  skyGrad.addColorStop(0, '#05080a');
  skyGrad.addColorStop(1, '#0a1a12');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, SCENE_WIDTH, FLOOR_Y);

  // Деревья
  ctx.fillStyle = '#14201a';
  for (let i = 0; i < 20; i++) {
    const tx = i * 100 + Math.sin(i) * 20;
    ctx.fillRect(tx, 80, 20, FLOOR_Y - 80);
    ctx.beginPath(); ctx.arc(tx + 10, 80, 40, 0, Math.PI * 2); ctx.fill();
  }

  // Земля
  ctx.fillStyle = '#0a0f0d';
  ctx.fillRect(0, FLOOR_Y, SCENE_WIDTH, 20);

  // КПП
  ctx.fillStyle = '#0f1a16';
  ctx.fillRect(500, FLOOR_Y - 120, 100, 120);
  ctx.fillStyle = '#1f3028';
  ctx.fillRect(490, FLOOR_Y - 130, 120, 10);
  ctx.fillStyle = '#2a3c34';
  ctx.fillRect(520, FLOOR_Y - 100, 60, 40);

  // Шлагбаум
  ctx.fillStyle = '#1a2620';
  ctx.fillRect(620, FLOOR_Y - 80, 10, 80);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#4a2020' : '#c8c8c8';
    // Если шлагбаум открыт, поднимаем его (рисуем повернутым)
    if (state.flags.barrierOpen) {
      ctx.fillRect(625, FLOOR_Y - 80 - i * 10, 8, 10);
    } else {
      ctx.fillRect(630 + i * 20, FLOOR_Y - 70, 20, 8);
    }
  }

  // Ключ-карта
  if (!state.items.includes('keycard')) {
    ctx.fillStyle = '#2a4a3a';
    ctx.fillRect(800, FLOOR_Y - 4, 12, 8);
    ctx.strokeStyle = '#4a7a5a'; ctx.lineWidth = 1;
    ctx.strokeRect(800, FLOOR_Y - 4, 12, 8);
  }

  // Персонажи
  drawCharon(720, FLOOR_Y);
  drawHero(heroX, FLOOR_Y, isWalking, heroDirection, walkTimer);

  ctx.restore();
}

/* ============ ИГРОВОЙ ЦИКЛ ============ */
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (targetX !== null) {
    const diff = targetX - heroX;
    const dist = Math.abs(diff);
    if (dist < 2) {
      heroX = targetX; targetX = null; isWalking = false;
      if (pendingClick) { const cb = pendingClick; pendingClick = null; cb(); }
    } else {
      const speed = 120; 
      const step = Math.min(dist, speed * dt);
      const dir = Math.sign(diff);
      heroDirection = dir;
      heroX += step * dir;
      isWalking = true;
      walkTimer += dt * 12;
    }
  } else {
    isWalking = false;
  }

  const targetCam = heroX - canvas.width / 2;
  cameraX += (targetCam - cameraX) * Math.min(1, dt * 4);
  cameraX = Math.max(0, Math.min(SCENE_WIDTH - canvas.width, cameraX));

  drawWorld();
  requestAnimationFrame(tick);
}

/* ============ УПРАВЛЕНИЕ ============ */
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width) + cameraX;
  targetX = clickX;
  pendingClick = null;
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width) + cameraX;
  const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  const objects = [
    { id: 'horace', x: 500, y: FLOOR_Y - 130, w: 100, h: 130 },
    { id: 'charon', x: 700, y: FLOOR_Y - 60, w: 40, h: 60 },
    { id: 'keycard', x: 800, y: FLOOR_Y - 12, w: 12, h: 8, condition: !state.items.includes('keycard') },
    { id: 'barrier', x: 620, y: FLOOR_Y - 80, w: 130, h: 80 },
    { id: 'booth', x: 500, y: FLOOR_Y - 130, w: 100, h: 130 },
  ];

  for (let obj of objects) {
    if (obj.condition === false) continue;
    if (clickX >= obj.x && clickX <= obj.x + obj.w && clickY >= obj.y && clickY <= obj.y + obj.h) {
      const approachX = obj.x + obj.w / 2 - 20;
      targetX = approachX;
      pendingClick = () => interact(obj.id);
      return;
    }
  }
});

function interact(id) {
  const obj = gameObjects[id];
  if (!obj) return;
  if (obj.onClick) { obj.onClick(); return; }
  const first = !state.seen[id];
  let text;
  if (typeof obj.text === 'function') text = obj.text();
  else text = first ? obj.text : (obj.repeat || "Уже смотрел. Ничего нового.");
  if (first && obj.onFirst) obj.onFirst();
  state.seen[id] = true; save();
  say(text);
}

const gameObjects = {
  forest: { text: "Сумрачный лес. Стволы уходят вверх и теряются в сером." },
  booth: { text: "Будка КПП. Внутри сидит человек в форме. На табличке: «Гораций. Смена — вечная»." },
  horace: {
    onClick: () => {
      if (state.flags.barrierOpen) { say("— Проходи, — говорит Гораций.", "Гораций"); return; }
      if (state.flags.horaceTalked && state.items.includes('keycard')) {
        if (!state.flags.stampGiven) {
          state.flags.stampGiven = true; state.flags.barrierOpen = true; save();
          say("Гораций ставит печать. Шлагбаум медленно поднимается.", "Гораций");
        }
        return;
      }
      if (state.flags.horaceTalked) { say("— Пропуск нужен.", "Гораций"); return; }
      state.flags.horaceTalked = true; save();
      say("«Ещё один. Пропуск есть?» Ты мотаешь головой. «Тогда стой».", "Гораций");
    }
  },
  charon: {
    onClick: () => {
      if (!state.flags.charonTalked) {
        state.flags.charonTalked = true; save();
        say("«Ещё одна заблудшая душа. Привет. Я — Харон. Но сегодня шлагбаум закрыт — не моя воля».", "Харон");
      } else if (!state.items.includes('keycard')) {
        say("— Ключ-карта? Лежит где-то у дороги.", "Харон");
      } else if (!state.flags.barrierOpen) {
        say("— Карта у тебя. Покажи Горацию.", "Харон");
      } else {
        say("— Шлагбаум поднят. Иди. Я буду ждать внизу.", "Харон");
      }
    }
  },
  keycard: {
    onClick: () => {
      if (state.items.includes('keycard')) { say("Ключ-карта уже у тебя."); return; }
      state.items.push('keycard'); save(); renderInventory();
      say("Ты подобрал ключ-карту. Она холодная.");
    }
  },
  barrier: {
    text: () => state.flags.barrierOpen ? "Шлагбаум поднят." : "Шлагбаум опущен."
  }
};

/* ============ ИНВЕНТАРЬ ============ */
const allItems = { keycard: { icon: '🗝', title: 'Ключ-карта', desc: 'Собственность КПП.' } };
function renderInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.items.forEach(id => {
    const item = allItems[id]; if (!item) return;
    const el = document.createElement('div');
    el.className = 'item-icon'; el.textContent = item.icon; el.title = item.title;
    el.addEventListener('click', () => {
      document.getElementById('modalText').innerHTML = `<h3>${item.title}</h3>${item.desc}`;
      document.getElementById('modal').classList.add('open');
    });
    inv.appendChild(el);
  });
}
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));

/* ============ СТАРТ ============ */
load();
if (state.cutsceneDone) {
  document.getElementById('cutscene').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  initGame();
} else {
  showCutscene();
}
</script>

</body>
</html>
